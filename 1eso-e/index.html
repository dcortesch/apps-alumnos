<title>Moto-Mates 1.º E</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cuaderno de juego para un alumno concreto, cálido y claro
   IDEA: el mapa de progreso de un videojuego: cada sesión es una parada del camino
   PICTURE: escena propia del alumno (carretera Moto-Mates, arcoíris, ruta de montaña) que avanza con su progreso
   COLOUR and TYPE: color dominante del alumno en la banda, acento fuerte en los botones; tipografía redonda y grande
   LAYOUT: banda superior con nombre y escena; rejilla de sesiones; práctica a una columna con teclado táctil */
:root{color-scheme:light dark;--bg:light-dark(#eaf6ff,#10151f);--ink:light-dark(#14213d,#eef2ff);--card:light-dark(#ffffff,#1a2233);--line:light-dark(#d9e1ee,#2c3850);--band:#0b4f8a;--bandink:#ffffff;--cta:#ff7a00;--ctaink:#fff;--soft:light-dark(#e3eefb,#222c42)}

*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cta);outline-offset:3px}
.band{padding:clamp(18px,3vw,40px) max(4vw,16px)}
.hero{background:var(--band);color:var(--bandink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,64px);line-height:1.02;margin:.1em 0 .15em;text-wrap:balance}
.kick{margin:0;font-weight:700;opacity:.85}.lead{margin:0 0 10px;font-size:19px;opacity:.95}
.tot{margin:0;display:flex;align-items:center;gap:6px;font-size:18px}.tot .st{width:26px;height:26px}
.hero-v svg{width:100%;height:auto;display:block}
h2{font-size:26px;line-height:1.15;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ses{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:4px 12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;min-height:96px;box-shadow:0 3px 0 var(--line)}
.ses:active{transform:translateY(2px);box-shadow:none}
.ses .n{grid-row:span 2;width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.ses .tt{font-weight:700;font-size:18px;line-height:1.2}.ses .tt i{display:block;font-weight:500;font-size:14px;opacity:.7}
.st{width:22px;height:22px;fill:light-dark(#dfe5ef,#3a4560)}.st.on{fill:#f59e0b}
.foot{display:flex;justify-content:flex-end}
.top{display:flex;align-items:center;gap:14px;padding-block:14px;background:var(--band);color:var(--bandink);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:22px}
.icon{width:52px;height:52px;border-radius:16px;border:0;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.qh .icon{background:var(--soft);color:var(--ink)}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}.dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.cur{background:#fff}.dot.ok{background:#22c55e}.dot.half{background:#f59e0b}.dot.no{background:#ef4444}
.cnt{font-weight:800;font-size:18px}
.card{background:var(--card);border-radius:28px;padding:clamp(18px,3vw,34px);border:3px solid var(--c);max-width:980px;margin:0 auto;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.tag{display:inline-block;margin:0 0 10px;background:var(--c);color:#fff;font-weight:800;padding:4px 14px;border-radius:99px;font-size:15px}
.lt{font-size:22px;line-height:1.45}.lt p{margin:.3em 0}
.ex{font-size:20px;font-weight:700;text-align:center;margin:8px 0 0}
.es{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:17px;font-style:italic;margin:10px 0}
.estog{border:2px solid var(--line);background:transparent;border-radius:99px;padding:6px 16px;font-size:15px;font-weight:700;margin-top:6px}.estog.on{background:var(--c);color:#fff;border-color:var(--c)}
.gl{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.gl .tag{width:100%;max-width:max-content}.gl span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:16px}
.visbox{background:#fff;color:#0f172a;border-radius:20px;padding:14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;border:2px solid light-dark(#eef2f7,#000)}
.visbox:empty{display:none}
.vis{max-width:100%;height:auto;max-height:260px;width:auto}.vis.sq{width:min(220px,40vw)}.vis.tall{height:240px}
.qh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qt{font-size:clamp(22px,2.8vw,28px);font-weight:600;line-height:1.35;margin:0}
.big{font-size:1.25em}
.qt .big{font-size:1.3em;font-weight:800;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-weight:800}.fr span+span{border-top:3px solid currentColor;padding-top:1px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}.opts.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:74px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-size:24px;font-weight:800;padding:10px;box-shadow:0 4px 0 var(--line)}

.opt.good,.disp.good{border-color:#16a34a;background:#dcfce7;color:#14532d}.opt.bad,.disp.bad{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}.opt:disabled{opacity:.6}
.disp{min-height:72px;border:3px solid var(--line);border-radius:18px;font-size:40px;font-weight:800;text-align:center;padding:6px;margin:6px auto 12px;max-width:420px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:460px;margin:0 auto}
.key{min-height:66px;border-radius:18px;border:0;background:var(--soft);font-size:30px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:none}.key.del{background:light-dark(#ffe4e6,#3b1d27)}
.fb{border-radius:18px;padding:14px 18px;font-size:20px;margin-top:14px;line-height:1.45}
.fb.ok{background:#dcfce7;color:#14532d}.fb.try,.fb.hint{background:#fef3c7;color:#713f12}.fb.no{background:#fee2e2;color:#7f1d1d}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:18px}
.cta,.ghost{min-height:56px;border-radius:18px;padding:10px 22px;font-weight:800;display:inline-flex;align-items:center;gap:8px;border:0}
.cta{background:var(--cta);color:var(--ctaink);box-shadow:0 4px 0 color-mix(in srgb,var(--cta) 60%,#000)}
.ghost{background:var(--soft);color:var(--ink)}
.cta:active,.ghost:active{transform:translateY(3px);box-shadow:none}
.endb{min-height:70vh;display:grid;place-items:center}.end{text-align:center}.end h2{font-size:clamp(36px,5vw,52px)}
.bigstars .st{width:min(90px,22vw);height:min(90px,22vw)}.sc{font-size:24px;font-weight:700}.end .row{justify-content:center}
.c-u{color:#ea580c}.c-d{color:#16a34a}.c-c{color:#2563eb}.c-r{color:#dc2626}.c-b{color:#2563eb}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:22px;padding:22px;max-width:980px;width:100%;max-height:90vh;overflow:auto}
.small{font-size:14px;opacity:.8}.sum{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.sum span{display:inline-flex;align-items:center;gap:2px;font-weight:700;background:var(--soft);border-radius:10px;padding:4px 8px}.sum .st{width:16px;height:16px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}td.r{text-align:right;white-space:nowrap}td.w{font-size:13px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
html,body{overscroll-behavior:none}
button,.ses,.key,.opt,.sl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--cta);margin-top:-14px;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media (min-width:1000px) and (orientation:landscape){.qbody.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:center}.qbody.two .visbox{margin:6px 0}.card{max-width:1120px}}
@media (orientation:portrait) and (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (display-mode:standalone){.top{padding-top:calc(14px + env(safe-area-inset-top))}}
.qcard{animation:slidein .45s cubic-bezier(.2,.9,.3,1.1)}@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.step .visbox{margin:8px auto}.exq{font-size:22px}
.who{max-width:640px}.mainwho{font-size:28px;min-height:84px;width:100%;justify-content:center;margin:10px 0 18px}
.whol{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 18px}.wf{display:grid;gap:10px;text-align:left;margin-top:10px}.wf label{font-weight:700}
.wf input{font:inherit;font-size:20px;padding:14px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);min-height:56px}.wf input:focus{outline:none;border-color:var(--cta)}.wf button{justify-content:center}
.endbtn{display:inline-flex;align-items:center;gap:6px;min-height:48px;border-radius:14px;border:2px solid currentColor;background:rgba(255,255,255,.15);color:inherit;font-weight:800;padding:6px 14px;flex:none;margin-left:auto}
.hero .endbtn{margin-left:0;color:var(--bandink)}.row.l{justify-content:flex-start;margin-top:14px}.row.sb{justify-content:space-between;align-items:center;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding-block:18px}.stats.in{padding:0;margin:14px 0}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:26px;line-height:1.1}.kpi span{font-size:14px;opacity:.75}
.bar{display:block;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--cta);border-radius:6px;transition:width .6s}
.unith{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:26px 0 12px}.unith .unit{margin:0}.unith .up{font-weight:700;font-size:15px;opacity:.8;justify-self:end}.unith .bar{grid-column:1/-1;margin:0}
.ses.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}.ss em{font-style:normal;font-size:13px;font-weight:700;margin-left:6px;opacity:.7}
.tries{font-size:14px;font-weight:800;background:var(--soft);border-radius:99px;padding:4px 12px;white-space:nowrap}
.dir{display:inline-block;font-weight:800}.opt.off{opacity:.25}
.wl{text-align:left;margin:10px 0;background:var(--soft);border-radius:14px;padding:10px 14px}.wl summary{font-weight:800;cursor:pointer}.wl li{margin:4px 0}
.sendst{font-weight:700;font-size:18px}.okk{color:#15803d}.warn{color:#b45309}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:140px;margin-bottom:8px}.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.days i{display:block;width:70%;background:var(--cta);border-radius:6px 6px 0 0;min-height:2px}.days span{font-size:11px;margin-top:4px}
.ut{width:100%;border-collapse:collapse;font-size:15px}.ut th,.ut td{border-bottom:1px solid var(--line);padding:6px}.tf{margin:0;padding-left:20px}
.mbox h3{font-size:18px;margin:18px 0 8px}
.unit{font-size:22px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--cta)}
.ses.rev{background:var(--soft)}
.labbox .ghost{background:var(--card);border:2px solid var(--line)}
.labbox{background:var(--soft);border-radius:22px;padding:16px;margin-top:16px}
.labv{background:#fff;color:#0f172a;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:120px}
.labr{text-align:center;font-size:22px;margin:10px 0}
.sl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 56px;gap:10px;align-items:center;margin:8px 0;font-weight:700;font-size:16px}
.sl b{text-align:center;font-size:20px;background:var(--card);border-radius:10px;padding:4px}
input[type=range]{width:100%;height:44px;accent-color:var(--cta)}
.steps{display:grid;gap:8px;min-height:60px}.step{font-size:24px;text-align:center;padding:10px;border-radius:14px;background:var(--card)}
.step.old{opacity:.55;font-size:20px}.step.new{animation:pop .6s cubic-bezier(.2,.9,.3,1.3);border:3px solid var(--cta)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.glt{width:100%;border-collapse:collapse;font-size:17px}.glt th{background:var(--c);color:#fff;text-align:left;padding:6px 10px}.glt td{padding:6px 10px;border-bottom:1px solid var(--line)}
.vt{border-collapse:collapse;font-size:18px;background:#fff;color:#0f172a}.vt th,.vt td{border:2px solid #94a3b8;padding:6px 14px;text-align:center}.vt th{background:#e0e7ff}
.inst{text-align:center;font-weight:700;font-size:19px;margin:6px 0}
.tapbox{padding:18px}.vis.tap{max-height:300px;width:min(560px,100%)}.vis.tap.sq{width:min(300px,70vw)}
.pc{fill:#fff;stroke:#334155;stroke-width:3;cursor:pointer;transition:fill .15s}.pc.on{fill:var(--cta)}
.tray{min-height:64px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px;font-size:26px;font-weight:800;margin-bottom:12px}
.tray span{background:var(--soft);border-radius:12px;padding:4px 12px}.tray i{font-style:normal;color:var(--cta)}
.ords{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.row.c{justify-content:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}.opts.o3{grid-template-columns:1fr}}

/* ---- combinadas paso a paso ---- */
.cmb{display:grid;gap:6px;background:#fff;color:#0f172a;border-radius:20px;padding:14px 16px;border:2px solid light-dark(#eef2f7,#000);overflow-x:auto}
.cline{display:flex;align-items:center;flex-wrap:nowrap;gap:2px;font-size:clamp(24px,3.4vw,34px);font-weight:800;line-height:1.2;white-space:nowrap;padding:4px 6px;border-radius:12px}
.cline.old{opacity:.6;font-size:clamp(20px,2.8vw,28px)}.cline.new{animation:pop .55s cubic-bezier(.2,.9,.3,1.3)}.cline.fin{background:#fef9c3;outline:3px solid #f59e0b}
.ceq{display:inline-block;width:1.3em;color:#94a3b8;text-align:center}.cx{display:inline-flex;align-items:center;border-radius:10px;transition:background .3s}
.cx.hl{background:color-mix(in srgb,var(--k) 18%,#fff);outline:3px solid var(--k);color:var(--k);padding:0 4px}
.cx.nw{color:var(--k);background:color-mix(in srgb,var(--k) 14%,#fff);padding:0 4px;animation:nw .9s ease}@keyframes nw{0%{transform:scale(.2);opacity:0}50%{transform:scale(1.25);opacity:1}100%{transform:none}}
.cop{font:inherit;color:inherit;background:none;border:0;padding:0 .18em;border-radius:10px;min-width:1.1em}.cop.live{background:#e0f2fe;box-shadow:0 3px 0 #7dd3fc;margin:0 2px;cursor:pointer}.cop.live:active{transform:translateY(2px)}
.cop.nope{background:#fee2e2;animation:shake .4s}.cop.pulse{animation:pulse 1s infinite;background:#fde68a}@keyframes pulse{50%{transform:scale(1.25)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cop.ce{font-size:.6em;min-width:0;padding:0 .2em}.cop.cr{font-size:1.1em}.rad{border-top:3px solid currentColor;padding:0 2px;margin-left:-2px}.cp{color:#64748b}
.cwhy{font-size:20px;text-align:center;margin:10px 0;min-height:1.5em}.csub{font-weight:800;white-space:nowrap;display:inline-flex;align-items:center}.eqb{font-size:34px;min-width:110px;justify-content:center}
.ghostfuse{display:inline-flex;align-items:center;font-weight:800;font-size:clamp(24px,3.4vw,34px)}

.ses.lock{filter:grayscale(1);opacity:.45;border-style:dashed}.unith.locked .unit{opacity:.55;border-left-color:#94a3b8}

/* ---- portada ---- */
.cover{position:relative;min-height:100vh;min-height:100dvh;display:grid;align-items:center;justify-items:end;overflow:hidden;background:#0c4a6e;padding:max(4vw,16px)}

</style></head><body><div id="app"></div>
<script>
// ===== Utilidades y dibujos SVG comunes (sin DOM) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const fmt=(x,dec)=>{let s=(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));return s.replace('.',',')};
const fmtEN=(x,dec)=>(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));
const miles=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const thou=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sg=n=>n<0?`(${n})`:`${n}`; // entero con paréntesis si negativo
// opciones de elección múltiple únicas a partir de la correcta y distractores
function mc(ans,dis,n=4){const s=[String(ans)];for(const d of dis){const v=String(d);if(!s.includes(v)&&s.length<n)s.push(v)}return shuffle(s)}
function near(ans,spread=3,n=4,allowNeg=false){const d=[];let g=0;while(d.length<n*3&&g++<200){const v=ans+R(-spread,spread);if(v!==ans&&(allowNeg||v>=0))d.push(v)}return d}

const PAL=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
const svg=(w,h,body,cls='')=>`<svg class="vis ${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||16}" font-weight="${o.w||700}" fill="${o.c||'currentColor'}" text-anchor="${o.a||'middle'}" dominant-baseline="middle" font-family="inherit">${t}</text>`;

const V={
  // bloques multibase: centenas, decenas, unidades
  blocks(c,d,u){const s=7,P=[];let x=10;
    for(let i=0;i<c;i++){let g=`<rect x="${x}" y="10" width="${s*10}" height="${s*10}" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x+k*s} 10v${s*10}M${x} ${10+k*s}h${s*10}" stroke="#1e3a8a" stroke-opacity=".45"/>`;P.push(g);x+=s*10+12}
    for(let i=0;i<d;i++){let g=`<rect x="${x}" y="10" width="${s}" height="${s*10}" rx="2" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x} ${10+k*s}h${s}" stroke="#14532d" stroke-opacity=".5"/>`;P.push(g);x+=s+7}
    if(d)x+=6;
    for(let i=0;i<u;i++){P.push(`<rect x="${x}" y="${10+s*9}" width="${s}" height="${s}" rx="1.5" fill="#f97316" stroke="#7c2d12" stroke-width="1.2"/>`);x+=s+5}
    return svg(Math.max(x+10,120),s*10+22,P.join(''))},
  // objetos sencillos para contar
  icon(kind,x,y,r=12,c){const col=c||({apple:'#ef4444',star:'#eab308',ball:'#3b82f6',fish:'#06b6d4',flower:'#ec4899',cookie:'#b45309'})[kind]||'#8b5cf6';
    if(kind==='star'){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${p}Z" fill="${col}" stroke="#854d0e" stroke-width="1"/>`}
    if(kind==='apple')return `<circle cx="${x}" cy="${y+1}" r="${r*.9}" fill="${col}"/><path d="M${x} ${y-r*.8}q2 -6 7 -7" stroke="#166534" stroke-width="2.5" fill="none"/><circle cx="${x-r*.35}" cy="${y-r*.2}" r="${r*.2}" fill="#fff" opacity=".5"/>`;
    if(kind==='fish')return `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.6}" fill="${col}"/><path d="M${x+r*.8} ${y}l${r*.7} -${r*.55}v${r*1.1}z" fill="${col}"/><circle cx="${x-r*.45}" cy="${y-r*.1}" r="2" fill="#0f172a"/>`;
    if(kind==='flower'){let g='';for(let i=0;i<5;i++){const a=Math.PI*2/5*i;g+=`<circle cx="${x+r*.55*Math.cos(a)}" cy="${y+r*.55*Math.sin(a)}" r="${r*.45}" fill="${col}"/>`}return g+`<circle cx="${x}" cy="${y}" r="${r*.35}" fill="#facc15"/>`}
    if(kind==='cookie')return `<circle cx="${x}" cy="${y}" r="${r}" fill="#d97706" stroke="#92400e" stroke-width="1.5"/><circle cx="${x-4}" cy="${y-3}" r="2" fill="#451a03"/><circle cx="${x+4}" cy="${y+2}" r="2" fill="#451a03"/><circle cx="${x-1}" cy="${y+5}" r="1.6" fill="#451a03"/>`;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><path d="M${x-r} ${y}h${2*r}M${x} ${y-r}q${r*.7} ${r} 0 ${2*r}" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/>`},
  objects(n,kind='apple',perRow=10){const r=13,gap=34,rows=Math.ceil(n/perRow),w=Math.min(n,perRow)*gap+16;let b='';
    for(let i=0;i<n;i++){const cx=24+(i%perRow)*gap,cy=24+Math.floor(i/perRow)*gap;b+=V.icon(kind,cx,cy,r)}return svg(Math.max(w,80),rows*gap+14,b)},
  // grupos en platos (multiplicación)
  groups(g,k,kind='cookie'){const pw=Math.max(90,Math.ceil(Math.sqrt(k))*30+20),W=g*(pw+12)+12;let b='';
    for(let i=0;i<g;i++){const x0=12+i*(pw+12);b+=`<ellipse cx="${x0+pw/2}" cy="60" rx="${pw/2}" ry="48" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`;
      const c=Math.ceil(Math.sqrt(k));for(let j=0;j<k;j++){const rr=Math.floor(j/c),cc=j%c,rowsN=Math.ceil(k/c);b+=V.icon(kind,x0+pw/2+(cc-(c-1)/2)*26,60+(rr-(rowsN-1)/2)*26,10)}}
    return svg(W,122,b)},
  // reparto: total objetos y k platos vacíos
  share(total,k,kind='cookie'){const W=Math.max(total*26+20,k*96+20);let b='';
    for(let i=0;i<total;i++)b+=V.icon(kind,20+i*26,22,10);
    for(let i=0;i<k;i++){const cx=60+i*96;b+=`<ellipse cx="${cx}" cy="86" rx="42" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`+T(cx,124,'plato '+(i+1),{s:12,w:600,c:'#92400e'})}
    return svg(W,136,b)},
  array(r,c,col='#8b5cf6'){let b='';for(let i=0;i<r;i++)for(let j=0;j<c;j++)b+=`<circle cx="${22+j*28}" cy="${22+i*28}" r="10" fill="${col}"/>`;return svg(c*28+16,r*28+16,b)},
  clock(h,m){const cx=100,cy=100;let b=`<circle cx="${cx}" cy="${cy}" r="92" fill="#fff" stroke="#3b82f6" stroke-width="8"/>`;
    for(let i=0;i<60;i++){const a=Math.PI/30*i,l=i%5?5:11;b+=`<line x1="${cx+80*Math.sin(a)}" y1="${cy-80*Math.cos(a)}" x2="${cx+(80-l)*Math.sin(a)}" y2="${cy-(80-l)*Math.cos(a)}" stroke="#334155" stroke-width="${i%5?1.5:3}"/>`}
    for(let i=1;i<=12;i++){const a=Math.PI/6*i;b+=T(cx+60*Math.sin(a),cy-60*Math.cos(a)+1,i,{s:18,c:'#0f172a'})}
    const ah=Math.PI/6*((h%12)+m/60),am=Math.PI/30*m;
    b+=`<line x1="${cx}" y1="${cy}" x2="${cx+40*Math.sin(ah)}" y2="${cy-40*Math.cos(ah)}" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>`;
    b+=`<line x1="${cx}" y1="${cy}" x2="${cx+66*Math.sin(am)}" y2="${cy-66*Math.cos(am)}" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#0f172a"/>`;
    return svg(200,200,b,'sq')},
  // dinero: lista en céntimos
  money(list){let x=10,b='';for(const v of list){
    if(v>=500){const col={500:'#9ca3af',1000:'#f87171',2000:'#60a5fa',5000:'#fb923c'}[v];b+=`<rect x="${x}" y="14" width="110" height="60" rx="6" fill="${col}" stroke="#1f2937" stroke-width="1.5"/><rect x="${x+8}" y="22" width="94" height="44" rx="4" fill="none" stroke="#fff" stroke-opacity=".7"/>`+T(x+55,44,(v/100)+' €',{s:22,c:'#111827'});x+=120}
    else if(v>=100){b+=`<circle cx="${x+30}" cy="44" r="29" fill="${v===200?'#d1d5db':'#facc15'}" stroke="#78716c" stroke-width="2"/><circle cx="${x+30}" cy="44" r="19" fill="${v===200?'#facc15':'#d1d5db'}"/>`+T(x+30,45,(v/100)+' €',{s:14,c:'#111827'});x+=66}
    else{const r=v>=10?24:19;b+=`<circle cx="${x+r}" cy="44" r="${r}" fill="${v>=10?'#eab308':'#c2410c'}" stroke="#78350f" stroke-width="2"/>`+T(x+r,45,v+' c',{s:13,c:'#fff'});x+=2*r+8}}
    return svg(x+6,88,b)},
  ruler(max,len,col='#ec4899'){const u=36,W=max*u+40;let b=`<rect x="10" y="44" width="${max*u+20}" height="40" rx="4" fill="#fde68a" stroke="#a16207"/>`;
    for(let i=0;i<=max*10;i++){const x=20+i*u/10,l=i%10?(i%5?7:12):18;b+=`<line x1="${x}" y1="44" x2="${x}" y2="${44+l}" stroke="#713f12" stroke-width="${i%10?1:2}"/>`;if(i%10===0)b+=T(x,74,i/10,{s:13,c:'#713f12'})}
    b+=`<rect x="20" y="16" width="${len*u-12}" height="18" rx="3" fill="${col}"/><path d="M${20+len*u-12} 16l12 9l-12 9z" fill="#fcd34d"/><path d="M${20+len*u-3} 22l3 3l-3 3z" fill="#1f2937"/>`;
    return svg(W,92,b)},
  pie(n,k,col='#f97316'){const cx=80,cy=80,r=70;let b='';
    if(n===1)return svg(160,160,`<circle cx="80" cy="80" r="70" fill="${k?col:'#fff'}" stroke="#334155" stroke-width="3"/>`,'sq');
    for(let i=0;i<n;i++){const a1=2*Math.PI*i/n-Math.PI/2,a2=2*Math.PI*(i+1)/n-Math.PI/2;
      b+=`<path d="M${cx} ${cy}L${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)}A${r} ${r} 0 ${n<=2?0:0} 1 ${(cx+r*Math.cos(a2)).toFixed(2)} ${(cy+r*Math.sin(a2)).toFixed(2)}Z" fill="${i<k?col:'#fff'}" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>`}
    return svg(160,160,b,'sq')},
  bar(n,k,col='#22c55e',W=320){const w=(W-20)/n;let b='';for(let i=0;i<n;i++)b+=`<rect x="${10+i*w}" y="10" width="${w}" height="56" fill="${i<k?col:'#fff'}" stroke="#334155" stroke-width="2.5"/>`;return svg(W,76,b)},
  // recta numérica
  line(min,max,o={}){const W=Math.min(720,Math.max(360,(max-min)/(o.step||1)*34+60)),x=v=>30+(v-min)*(W-60)/(max-min);let b=`<line x1="14" y1="70" x2="${W-14}" y2="70" stroke="#334155" stroke-width="3"/><path d="M${W-14} 70l-10 -6v12z" fill="#334155"/>`;
    const step=o.step||1;for(let v=min;v<=max;v+=step){b+=`<line x1="${x(v)}" y1="62" x2="${x(v)}" y2="78" stroke="#334155" stroke-width="2"/>`;if(!o.hide||!o.hide.includes(v))b+=T(x(v),96,v===0?'0':(o.fmt?o.fmt(v):v),{s:14,c:v<0?'#dc2626':v>0?'#2563eb':'currentColor'})}
    (o.jumps||[]).forEach((j,i)=>{const c=j.c||PAL[(i*3+5)%8],x1=x(j.from),x2=x(j.to),h=22+i*14;b+=`<path d="M${x1} 62Q${(x1+x2)/2} ${62-h*2} ${x2} 62" fill="none" stroke="${c}" stroke-width="3"/><path d="M${x2} 62l${x2>x1?-9:9} -5l${x2>x1?2:-2} 9z" fill="${c}"/>`;if(j.t)b+=T((x1+x2)/2,62-h-6,j.t,{s:13,c})});
    (o.points||[]).forEach(p=>{b+=`<circle cx="${x(p.v)}" cy="70" r="8" fill="${p.c||'#ef4444'}" stroke="#fff" stroke-width="2"/>`;if(p.t)b+=T(x(p.v),40,p.t,{s:16,c:p.c||'#ef4444'})});
    return svg(W,110,b)},
  thermo(t,min=-10,max=30){const H=220,y=v=>H-30-(v-min)*(H-60)/(max-min);let b=`<rect x="60" y="20" width="26" height="${H-40}" rx="13" fill="#fff" stroke="#334155" stroke-width="2.5"/><circle cx="73" cy="${H-22}" r="20" fill="#ef4444" stroke="#334155" stroke-width="2.5"/><rect x="66" y="${y(t)}" width="14" height="${H-22-y(t)}" fill="#ef4444"/>`;
    for(let v=min;v<=max;v++)if(v%5)b+=`<line x1="86" y1="${y(v)}" x2="93" y2="${y(v)}" stroke="#334155" stroke-width="1.2"/>`;
    for(let v=min;v<=max;v+=5){b+=`<line x1="86" y1="${y(v)}" x2="98" y2="${y(v)}" stroke="#334155" stroke-width="2"/>`+T(104,y(v),v+'°',{s:13,a:'start',c:v<0?'#2563eb':v>0?'#dc2626':'currentColor'})}
    return svg(150,H,b,'tall')},
  grid100(k,col='#8b5cf6'){let b='';for(let i=0;i<100;i++)b+=`<rect x="${10+(i%10)*20}" y="${10+Math.floor(i/10)*20}" width="20" height="20" fill="${i<k?col:'#fff'}" stroke="#64748b"/>`;return svg(220,220,b,'sq')},
  squares(n,col='#06b6d4'){const s=Math.min(28,200/n);let b='';for(let i=0;i<n;i++)for(let j=0;j<n;j++)b+=`<rect x="${10+j*s}" y="${10+i*s}" width="${s}" height="${s}" fill="${col}" fill-opacity="${(i+j)%2?.85:.6}" stroke="#0e7490"/>`;return svg(n*s+20,n*s+20,b,'sq')},
  rect(w,h,uw='',col='#a78bfa',grid=false){const s=Math.min(30,260/w,160/h),W=w*s,Hh=h*s;let b=`<rect x="40" y="20" width="${W}" height="${Hh}" fill="${col}" fill-opacity=".55" stroke="#5b21b6" stroke-width="3"/>`;
    if(grid){for(let i=1;i<w;i++)b+=`<line x1="${40+i*s}" y1="20" x2="${40+i*s}" y2="${20+Hh}" stroke="#5b21b6" stroke-opacity=".4"/>`;for(let i=1;i<h;i++)b+=`<line x1="40" y1="${20+i*s}" x2="${40+W}" y2="${20+i*s}" stroke="#5b21b6" stroke-opacity=".4"/>`}
    b+=T(40+W/2,Hh+40,w+' '+uw,{s:16})+T(26,20+Hh/2,h+' '+uw,{s:16,a:'end'});return svg(W+80,Hh+56,b)},
  tri(base,h,uw=''){const s=Math.min(26,240/base,150/h),B=base*s,Hh=h*s,ax=40+B*.35;let b=`<path d="M40 ${20+Hh}h${B}L${ax} 20z" fill="#fdba74" fill-opacity=".7" stroke="#c2410c" stroke-width="3"/><line x1="${ax}" y1="20" x2="${ax}" y2="${20+Hh}" stroke="#c2410c" stroke-dasharray="6 5" stroke-width="2"/><path d="M${ax} ${20+Hh-12}h12v12" fill="none" stroke="#c2410c" stroke-width="2"/>`;
    b+=T(40+B/2,Hh+40,base+' '+uw,{s:16})+T(ax+8,20+Hh/2,'h = '+h+' '+uw,{s:15,a:'start'});return svg(B+120,Hh+56,b)},
  shape(name,col){const c=col||'#38bdf8',P={triangulo:[3],cuadrado:[4],pentagono:[5],hexagono:[6],octogono:[8]};let b;
    if(name==='circulo')b=`<circle cx="80" cy="80" r="62" fill="${c}" stroke="#0f172a" stroke-width="3"/>`;
    else if(name==='rectangulo')b=`<rect x="14" y="40" width="132" height="80" fill="${c}" stroke="#0f172a" stroke-width="3"/>`;
    else if(name==='rombo')b=`<path d="M80 12L140 80L80 148L20 80Z" fill="${c}" stroke="#0f172a" stroke-width="3"/>`;
    else{const n=P[name][0];let p='';for(let i=0;i<n;i++){const a=2*Math.PI*i/n-Math.PI/2+(n===4?Math.PI/4:0);p+=(i?'L':'M')+(80+66*Math.cos(a)).toFixed(1)+' '+(84+66*Math.sin(a)).toFixed(1)}b=`<path d="${p}Z" fill="${c}" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>`}
    return svg(160,160,b,'sq')},
  angle(deg){const cx=60,cy=150,r=120,a=deg*Math.PI/180;let b=`<line x1="${cx}" y1="${cy}" x2="${cx+r+40}" y2="${cy}" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy-r*Math.sin(a)}" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>`;
    b+=deg===90?`<path d="M${cx+26} ${cy}v-26h-26" fill="#fde047" fill-opacity=".6" stroke="#ca8a04" stroke-width="3"/>`:`<path d="M${cx+40} ${cy}A40 40 0 ${deg>180?1:0} 0 ${cx+40*Math.cos(a)} ${cy-40*Math.sin(a)}" fill="none" stroke="#ca8a04" stroke-width="4"/>`;
    return svg(260,170,b)},
  barChart(labels,vals,col){const max=Math.max(...vals),top=Math.ceil(max/5)*5||5,W=labels.length*70+70,H=230,y=v=>H-40-v*(H-70)/top;let b='';
    for(let v=0;v<=top;v+=top/5){b+=`<line x1="44" y1="${y(v)}" x2="${W-10}" y2="${y(v)}" stroke="#94a3b8" stroke-opacity=".5"/>`+T(38,y(v),v,{s:12,a:'end',w:500})}
    labels.forEach((l,i)=>{const x=60+i*70;b+=`<rect x="${x}" y="${y(vals[i])}" width="46" height="${H-40-y(vals[i])}" rx="4" fill="${col||PAL[(i*2+1)%8]}"/>`+T(x+23,H-24,l,{s:13,w:600})});
    return svg(W,H,b)},
  // cuadro de valor posicional
  pvt(digits,heads,cols){let b='';const w=62;heads.forEach((h,i)=>{b+=`<rect x="${10+i*w}" y="8" width="${w}" height="34" fill="${cols[i%cols.length]}" stroke="#334155"/>`+T(10+i*w+w/2,26,h,{s:15,c:'#fff'});b+=`<rect x="${10+i*w}" y="42" width="${w}" height="50" fill="#fff" stroke="#334155"/>`+T(10+i*w+w/2,68,digits[i]??'',{s:26,c:'#0f172a'})});return svg(heads.length*w+20,100,b)},

 g:[()=>{const k=R(2,4),q=R(2,5);return{q:`Reparte ${k*q} galletas en ${k} platos. ¿Cuántas en cada uno?`,vis:V.share(k*q,k),type:'num',ans:q,hint:'Ve poniendo una en cada plato, por turnos.',exp:`${k*q} : ${k} = <b>${q}</b>.`}},
  ()=>{const d=R(2,9),q=R(2,9);return{q:`<b class="big">${d*q} : ${d} = ?</b>`,vis:V.array(d,q,'#06b6d4'),type:'num',ans:q,hint:`¿Qué número por ${d} da ${d*q}? Cuenta las columnas.`,exp:`${d} × ${q} = ${d*q} → <b>${q}</b>.`}}]},
{t:'Problemas paso a paso',u:1,learn:{h:'<p><b>1.</b> Lee despacio. <b>2.</b> Subraya los números. <b>3.</b> ¿Qué me preguntan?</p><p><b>Junto</b> → sumo. <b>Quito o gasto</b> → resto. <b>Varias veces lo mismo</b> → multiplico. <b>Reparto</b> → divido.</p>',v:()=>V.money([1000,500,200]),x:''},
 steps:['"Tengo 20 € y gasto 7 €. ¿Cuánto me queda?"','Datos: 20 y 7','Gastar → <b>restar</b>','20 − 7 = <b class="big">13 €</b>'],
 g:[()=>{const a=R(10,50),b=R(5,a-2);return{q:`Tengo ${a} € y me gasto ${b} €. ¿Cuánto me queda?`,vis:V.money(a>=20?[2000,...Array(Math.min(3,Math.floor((a-20)/5))).fill(500)]:[1000]),type:'num',ans:a-b,hint:'Gastar → restar.',exp:`${a} − ${b} = <b>${a-b} €</b>.`}},
  ()=>{const c=R(3,6),k=R(4,9);return{q:`Hay ${c} cajas con ${k} lápices cada una. ¿Cuántos lápices hay?`,vis:V.groups(c,Math.min(k,6),'ball'),type:'num',ans:c*k,hint:'Cajas iguales → multiplicar.',exp:`${c} × ${k} = <b>${c*k}</b>.`}},
  ()=>{const op=pick([['sumar','+'],['restar','−'],['multiplicar','×'],['dividir',':']]);const P={'+':'Juan tiene 12 cromos y le regalan 5.','−':'Había 30 alumnos y se van 4.','×':'Compro 6 paquetes de 4 yogures.',':':'Reparto 20 caramelos entre 4 amigos.'};return{q:`${P[op[1]]} ¿Qué operación hago?`,vis:'',type:'mc',opts:['sumar','restar','multiplicar','dividir'],fixed:true,ans:op[0],hint:'Junto: sumar. Quito: restar. Grupos iguales: multiplicar. Reparto: dividir.',exp:`Hay que <b>${op[0]}</b>.`}}]},
{t:'Cuadrados',u:1,learn:{h:'<p>Un número <b>al cuadrado</b> es un cuadrado de cuadraditos.</p><p>3² = 3 × 3 = <b>9</b>. 4² = 4 × 4 = <b>16</b>.</p>',v:()=>V.squares(3)+V.squares(4,'#f97316'),x:'3² = 9 · 4² = 16'},
 steps:['<b>5²</b>','Significa 5 × 5','Un cuadrado de 5 filas y 5 columnas','<b class="big">25</b>'],lab:['squares'],
 g:[()=>{const n=R(2,9);return{q:`¿Cuántos cuadraditos hay? (${n}²)`,vis:V.squares(n),type:'num',ans:n*n,hint:`${n} filas de ${n}.`,exp:`${n} × ${n} = <b>${n*n}</b>.`}},
  ()=>{const n=R(2,10);return{q:`<b class="big">${n}<sup>2</sup> = ?</b>`,vis:V.squares(Math.min(n,8),'#22c55e'),type:'num',ans:n*n,hint:`Multiplica ${n} × ${n}.`,exp:`<b>${n*n}</b>.`}}]},
{t:'Múltiplos y divisores',u:1,learn:{h:'<p>Los <b>múltiplos</b> de 3 son la tabla del 3: 3, 6, 9, 12…</p><p>Un número es <b>divisor</b> de otro si lo reparte <b>exacto</b>, sin que sobre nada.</p>',v:()=>V.line(0,15,{step:1,jumps:[0,1,2,3,4].map(i=>({from:i*3,to:i*3+3,t:'+3'}))}),x:'Múltiplos de 3: 3, 6, 9, 12, 15'},
 steps:['¿Es 4 divisor de 12?','Reparto 12 en 4 grupos','Salen 3 en cada grupo y no sobra nada','<b class="big">Sí, 12 : 4 = 3 exacto</b>'],lab:['array'],
 g:[()=>{const t=pick([2,3,5,10]),k=R(2,9),c=t*k;return{q:`¿Cuál está en la tabla del <b>${t}</b> (es múltiplo de ${t})?`,vis:V.line(0,t*6,{step:t,jumps:[0,1,2,3,4,5].map(i=>({from:i*t,to:i*t+t,t:'+'+t}))}),type:'mc',opts:mc(c,[c+1,c-1,c+2].filter(x=>x%t)),ans:String(c),hint:`Cuenta de ${t} en ${t}.`,exp:`${c} = ${t} × ${k}.`}},
  ()=>{const n=pick([6,8,10,12]),d=pick([2,3,4,5].filter(x=>n%x===0));return{q:`Con ${n} puntos, ¿puedo hacer filas iguales de <b>${d}</b>?`,vis:V.array(n/d,d,'#8b5cf6'),type:'mc',opts:['Sí','No'],fixed:true,ans:'Sí',hint:'¿Sobra algún punto?',exp:`Sí: ${n} : ${d} = ${n/d}. ${d} es divisor de ${n}.`}}]},
// ---------- UD 2 ----------
{t:'Números negativos en la vida',u:2,learn:{h:'<p>Usamos números <b class="c-r">negativos</b> para lo que está <b>por debajo del cero</b>:</p><p>🌡 temperaturas bajo cero, 🏢 sótanos, 💶 deudas.</p>',v:()=>V.thermo(-4),x:'−4 °C: cuatro grados bajo cero'},
 steps:['El ascensor está en la planta <b>0</b> (baja)','Baja <b>2</b> plantas','Está en el sótano 2','Lo escribimos <b class="big">−2</b>'],lab:['thermo'],
 g:[()=>{const t=R(-9,15);return{q:'¿Qué temperatura marca?',vis:V.thermo(t),type:'num',ans:t,hint:'Si está por debajo del 0, pon el signo − (tecla −).',exp:`<b>${t} °C</b>.`}},
  ()=>{const e=pick([['Debo 5 €',-5],['Tengo 8 € ahorrados',8],['Sótano 3',-3],['3 grados bajo cero',-3],['Estoy en la planta 4',4]]);return{q:`¿Qué número representa: <b>${e[0]}</b>?`,vis:'',type:'mc',opts:mc(String(e[1]).replace('-','−'),[String(-e[1]).replace('-','−'),String(Math.abs(e[1])+1),String(-Math.abs(e[1])-1).replace('-','−')]),ans:String(e[1]).replace('-','−'),hint:'Deber, bajo cero o sótano → negativo.',exp:`<b>${String(e[1]).replace('-','−')}</b>.`}}]},
{t:'La recta de los enteros',u:2,learn:{h:'<p>En la recta, los <b class="c-r">negativos</b> están a la <b>izquierda</b> del 0 y los <b class="c-b">positivos</b> a la derecha.</p><p>Cuanto más a la <b>derecha</b>, más grande.</p>',v:()=>V.line(-6,6,{points:[{v:-4,t:'−4',c:'#dc2626'},{v:3,t:'+3',c:'#2563eb'}]}),x:'−4 &lt; 3'},
 steps:['¿Quién es mayor: <b>−5</b> o <b>−2</b>?','Busco los dos en la recta','−2 está más a la <b>derecha</b>','<b class="big">−2 &gt; −5</b>'],lab:['numline',{a:-3,b:0}],
 g:[()=>{const v=R(-7,7)||3;return{q:'¿Qué número señala el punto rojo?',vis:V.line(-8,8,{points:[{v}],hide:[v]}),type:'num',ans:v,hint:'Cuenta las rayitas desde el 0. A la izquierda es negativo.',exp:`<b>${v}</b>.`}},
  ()=>{let a=R(-9,9),b=R(-9,9);if(a===b)b=a+1;const s=a>b?'>':'<';return{q:`Elige el signo: <b class="big">${a} ☐ ${b}</b>`,vis:V.line(-10,10,{step:2,points:[{v:a,c:'#8b5cf6',t:a},{v:b,c:'#f97316',t:b}]}),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'El que está más a la derecha es mayor.',exp:`${a} ${s} ${b}`}},
  ()=>{const ns=[];while(ns.length<4){const v=R(-9,9);if(!ns.includes(v))ns.push(v)}return{q:'Ordena de <b>menor a mayor</b>.',vis:V.line(-10,10,{step:2}),type:'order',items:shuffle(ns.map(String)),ans:ns.slice().sort((x,y)=>x-y).map(String),hint:'Los negativos van primero.',exp:ns.slice().sort((x,y)=>x-y).join(' &lt; ')}}]},
{t:'Sumar enteros con la recta',u:2,learn:{h:'<p>Para sumar en la recta: me pongo en el primer número y <b>salto</b>.</p><p>Sumar un número <b>positivo</b> → salto a la <b>derecha</b>. Sumar un <b>negativo</b> → salto a la <b>izquierda</b>.</p>',v:()=>V.line(-4,4,{jumps:[{from:-3,to:2,t:'+5'}],points:[{v:2,t:'2',c:'#16a34a'}]}),x:'−3 + 5 = 2'},
 steps:['<b>−2 + 6</b>','Me pongo en el −2','Salto 6 a la derecha: −1, 0, 1, 2, 3, 4','<b class="big">= 4</b>'],lab:['numline'],
 g:[()=>{const a=R(-6,3),b=R(1,6);return{q:`<b class="big">${a} + ${b} = ?</b>`,vis:V.line(Math.min(a,0)-1,a+b+1,{jumps:[{from:a,to:a+b,t:'+'+b}],points:[{v:a,c:'#8b5cf6'}]}),type:'num',ans:a+b,hint:`Ponte en el ${a} y salta ${b} a la derecha.`,exp:`<b>${a+b}</b>.`}},
  ()=>{const t=R(-5,5),s=R(2,8);return{q:`Hace ${t} °C y la temperatura <b>sube</b> ${s} grados. ¿Cuántos grados hace?`,vis:V.thermo(t),type:'num',ans:t+s,hint:'Sube → sumo.',exp:`${t} + ${s} = <b>${t+s} °C</b>.`}}]},
{t:'Restar enteros con la recta',u:2,learn:{h:'<p>Restar un número es saltar a la <b>izquierda</b>.</p><p>3 − 5: me pongo en el 3 y salto 5 a la izquierda: llego a <b>−2</b>.</p>',v:()=>V.line(-3,4,{jumps:[{from:3,to:-2,t:'−5',c:'#dc2626'}],points:[{v:-2,t:'−2'}]}),x:'3 − 5 = −2'},
 steps:['<b>1 − 4</b>','Me pongo en el 1','Salto 4 a la izquierda: 0, −1, −2, −3','<b class="big">= −3</b>'],lab:['numline',{a:3,b:-5}],
 g:[()=>{const a=R(-3,6),b=R(1,7);return{q:`<b class="big">${a} − ${b} = ?</b>`,vis:V.line(a-b-1,Math.max(a,0)+1,{jumps:[{from:a,to:a-b,t:'−'+b,c:'#dc2626'}],points:[{v:a,c:'#8b5cf6'}]}),type:'num',ans:a-b,hint:`Ponte en el ${a} y salta ${b} a la izquierda.`,exp:`<b>${a-b}</b>.`}},
  ()=>{const p=R(1,4),b=R(p+1,p+3);return{q:`Estoy en la planta ${p} y bajo ${b} plantas. ¿En qué planta estoy?`,vis:'',type:'num',ans:p-b,hint:'Bajar → restar. Debajo de la planta 0 son negativos.',exp:`${p} − ${b} = <b>${p-b}</b>.`}}]},
// ---------- UD 3 ----------
{t:'Partes iguales',u:3,learn:{h:'<p>Una <b>fracción</b> sale de partir algo en <b>partes iguales</b>.</p><p>El número de <b>abajo</b> dice en cuántas partes lo partimos. El de <b>arriba</b>, cuántas cogemos.</p>',v:()=>V.pie(4,3,'#f97316'),x:'3 de 4 trozos = '+fr(3,4)},
 steps:['Partimos una pizza en <b>6</b> trozos iguales','Nos comemos <b>2</b>','Abajo: 6 (trozos). Arriba: 2 (comidos)','<b class="big">'+fr(2,6)+'</b>'],lab:['fraction'],
 g:[()=>{const n=pick([2,3,4,5,6,8]);return{q:'¿En cuántas partes iguales está partida?',vis:V.pie(n,0),type:'num',ans:n,hint:'Cuenta los trozos.',exp:`<b>${n}</b> partes.`}},
  ()=>{const n=R(3,8),k=R(1,n-1);return{q:'¿Cuántos trozos están coloreados?',vis:V.bar(n,k,pick(RC)),type:'num',ans:k,hint:'Cuenta solo los de color.',exp:`<b>${k}</b> de ${n}: ${fr(k,n)}.`}}]},
{t:'Leer fracciones',u:3,learn:{h:'<p>'+fr(1,2)+' un medio · '+fr(1,3)+' un tercio · '+fr(1,4)+' un cuarto · '+fr(3,5)+' tres quintos.</p>',v:()=>V.pie(2,1)+V.pie(3,1,'#22c55e')+V.pie(4,1,'#3b82f6'),x:''},
 steps:['¿Qué fracción está pintada?','Cuento todos los trozos: <b>5</b> (abajo)','Cuento los pintados: <b>2</b> (arriba)','<b class="big">'+fr(2,5)+'</b>'],lab:['fraction'],
 g:[()=>{const n=R(3,8),k=R(1,n-1);const o=[`${k}/${n}`,`${n}/${k}`,`${n-k}/${n}`,`${k}/${n+1}`];return{q:'¿Qué fracción está coloreada?',vis:pick([V.pie(n,k,pick(RC)),V.bar(n,k,pick(RC))]),type:'mc',opts:mc(o[0],o.slice(1)),ans:o[0],hint:'Abajo: todos los trozos. Arriba: los pintados.',exp:`<b>${k}/${n}</b>.`}},
  ()=>{const n=R(3,8),k=R(1,n-1);return{q:`Colorea ${fr(k,n)}.`,vis:'',type:'shade',n,shape:pick(['bar','pie']),ans:k,hint:`Hay ${n} trozos; pinta ${k}.`,exp:`${k} de ${n}.`}}]},
{t:'Fracciones equivalentes',u:3,learn:{h:'<p>Dos fracciones son <b>equivalentes</b> si pintan <b>lo mismo</b>.</p><p>'+fr(1,2)+' = '+fr(2,4)+' = '+fr(4,8)+'</p>',v:()=>V.bar(2,1,'#22c55e')+V.bar(4,2,'#22c55e')+V.bar(8,4,'#22c55e'),x:'Pintan la misma cantidad'},
 steps:[fr(1,3)+' = '+fr('?',6),'De 3 a 6 he multiplicado por <b>2</b>','Arriba también × 2: 1 × 2 = 2','<b class="big">'+fr(1,3)+' = '+fr(2,6)+'</b>'],lab:['fraction'],
 g:[()=>{const b=pick([2,3,4]),k=R(1,b-1),m=2;return{q:`Completa: ${fr(k,b)} = ${fr('?',b*m)}`,vis:V.bar(b,k,'#3b82f6')+V.bar(b*m,k*m,'#3b82f6'),type:'num',ans:k*m,hint:'Mira las dos barras: ¿cuántos trozos pintados tiene la de abajo?',exp:`<b>${k*m}</b>.`}},
  ()=>{const b=pick([2,3,4]),k=R(1,b-1),m=R(2,3);return{q:`¿Son equivalentes ${fr(k,b)} y ${fr(k*m,b*m)}?`,vis:V.bar(b,k,'#ec4899')+V.bar(b*m,k*m,'#ec4899'),type:'mc',opts:['Sí','No'],fixed:true,ans:'Sí',hint:'¿Las barras pintan lo mismo?',exp:'<b>Sí</b>: pintan lo mismo.'}}]},
{t:'Comparar fracciones',u:3,learn:{h:'<p>Si tienen el <b>mismo denominador</b> (abajo), es mayor la que tiene <b>más trozos pintados</b> (arriba).</p>',v:()=>V.bar(5,3,'#f97316')+V.bar(5,1,'#f97316'),x:fr(3,5)+' &gt; '+fr(1,5)},
 steps:['Comparo '+fr(2,6)+' y '+fr(5,6),'Mismo denominador: 6','Arriba: 2 y 5','<b class="big">'+fr(2,6)+' &lt; '+fr(5,6)+'</b>'],
 g:[()=>{const d=R(4,8);let a=R(1,d-1),b=R(1,d-1);if(a===b)return null;const s=a>b?'>':'<';return{q:`Elige el signo: ${fr(a,d)} ☐ ${fr(b,d)}`,vis:V.bar(d,a,'#ec4899')+V.bar(d,b,'#06b6d4'),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'¿Qué barra tiene más pintado?',exp:`${a}/${d} ${s} ${b}/${d}`}},
  ()=>{const p=pick([[1,2,1,4],[1,2,1,3],[3,4,1,4],[2,3,1,3]]);const s=p[0]/p[1]>p[2]/p[3]?'>':'<';return{q:`Elige el signo: ${fr(p[0],p[1])} ☐ ${fr(p[2],p[3])}`,vis:V.pie(p[1],p[0])+V.pie(p[3],p[2],'#3b82f6'),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'¿Qué pizza tiene más pintado?',exp:`${p[0]}/${p[1]} ${s} ${p[2]}/${p[3]}`}}]},
{t:'Fracción de una cantidad',u:3,learn:{h:'<p>Para calcular '+fr(1,4)+' de 12: reparto 12 en <b>4</b> grupos → cada grupo tiene <b>3</b>.</p><p>Para '+fr(3,4)+' de 12, cojo 3 grupos: <b>9</b>.</p>',v:()=>V.groups(4,3,'apple'),x:'1/4 de 12 = 3 · 3/4 de 12 = 9'},
 steps:[fr(2,3)+' de 15','Divido entre el de abajo: 15 : 3 = 5','Multiplico por el de arriba: 5 × 2','<b class="big">10</b>'],
 g:[()=>{const d=pick([2,3,4]),u=R(2,6);return{q:`¿Cuánto es ${fr(1,d)} de <b>${d*u}</b>?`,vis:V.groups(d,u,'cookie'),type:'num',ans:u,hint:`Reparte ${d*u} en ${d} grupos.`,exp:`${d*u} : ${d} = <b>${u}</b>.`}},
  ()=>{const d=pick([3,4,5]),k=R(2,d-1),u=R(2,5);return{q:`¿Cuánto es ${fr(k,d)} de <b>${d*u}</b>?`,vis:V.groups(d,u,'apple'),type:'num',ans:k*u,hint:`Un grupo tiene ${d*u} : ${d}. Coge ${k} grupos.`,exp:`${d*u} : ${d} = ${u}; ${u} × ${k} = <b>${k*u}</b>.`}}]},
// ---------- UD 4 ----------
{t:'Las décimas',u:4,learn:{h:'<p>Si parto la unidad en <b>10</b> trozos, cada trozo es <b>una décima</b>: 0,1.</p><p>3 trozos = <b>0,3</b>.</p>',v:()=>V.bar(10,3,'#22c55e'),x:'0,3 = tres décimas = '+fr(3,10)},
 steps:['La barra entera vale <b>1</b>','Está partida en 10: cada trozo es 0,1','Hay 7 pintados','<b class="big">0,7</b>'],lab:['percent'],
 g:[()=>{const k=R(1,9);return{q:'La barra entera es 1. ¿Qué número decimal está pintado?',vis:V.bar(10,k,pick(RC)),type:'mc',opts:mc(`0,${k}`,[`${k}`,`0,${10-k}`,`0,0${k}`]),ans:`0,${k}`,hint:'Cada trozo es 0,1.',exp:`<b>0,${k}</b>.`}},
  ()=>{const k=R(1,9);return{q:`Colorea <b>0,${k}</b> de la barra.`,vis:'',type:'shade',n:10,shape:'bar',ans:k,hint:`0,${k} son ${k} décimas.`,exp:`${k} trozos de 10.`}}]},
{t:'Decimales con dinero',u:4,learn:{h:'<p>Con el dinero ya usamos decimales: <b>2,50 €</b> son 2 euros y 50 céntimos.</p><p>1 euro = 100 céntimos.</p>',v:()=>V.money([200,50]),x:'2 € + 50 c = 2,50 €'},
 steps:['Tengo: 1 € + 1 € + 20 c + 20 c','Euros: 2','Céntimos: 40','<b class="big">2,40 €</b>'],lab:['money'],
 g:[()=>{const e=R(1,4),c=pick([10,20,50]);return{q:'¿Cuánto dinero hay?',vis:V.money([...Array(e).fill(100),c]),type:'mc',opts:mc(`${e},${String(c).padStart(2,'0')} €`,[`${e+1},${String(c).padStart(2,'0')} €`,`${e},${String(c+10).padStart(2,'0')} €`,`${c},${e} €`]),ans:`${e},${String(c).padStart(2,'0')} €`,hint:'Primero los euros, luego los céntimos.',exp:`<b>${e},${String(c).padStart(2,'0')} €</b>.`}},
  ()=>{const a=pick([150,250,120,380,210]),b=pick([100,200,50]);return{q:`Un bocadillo cuesta ${fmt(a/100,2)} € y un zumo ${fmt(b/100,2)} €. ¿Cuánto cuesta todo?`,vis:V.money([a>=200?200:100,50]),type:'num',ans:(a+b)/100,hint:'Suma euros con euros y céntimos con céntimos.',exp:`<b>${fmt((a+b)/100,2)} €</b>.`}}]},
{t:'Comparar decimales',u:4,learn:{h:'<p>Compara primero la parte <b>entera</b> (antes de la coma). Si es igual, compara las <b>décimas</b>.</p>',v:()=>V.line(0,1,{step:.1,fmt:v=>fmt(+v.toFixed(1)),points:[{v:.3,t:'0,3'},{v:.7,t:'0,7',c:'#2563eb'}]}),x:'0,3 &lt; 0,7'},
 steps:['Comparo 2,4 y 2,9','Parte entera: 2 y 2 → empate','Décimas: 4 y 9','<b class="big">2,4 &lt; 2,9</b>'],
 g:[()=>{let a=R(1,9),b=R(1,9);if(a===b)return null;const s=a>b?'>':'<';return{q:`Elige el signo: <b class="big">0,${a} ☐ 0,${b}</b>`,vis:V.line(0,1,{step:.1,fmt:v=>fmt(+v.toFixed(1)),points:[{v:a/10,c:'#8b5cf6'},{v:b/10,c:'#f97316'}]}),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'Más a la derecha es mayor.',exp:`0,${a} ${s} 0,${b}`}},
  ()=>{const e=R(1,5),ns=shuffle([1,4,7,9]).slice(0,3).map(d=>e+d/10);return{q:'Ordena de <b>menor a mayor</b>.',vis:'',type:'order',items:shuffle(ns.map(v=>fmt(v))),ans:ns.slice().sort((x,y)=>x-y).map(v=>fmt(v)),hint:'Mira las décimas.',exp:ns.slice().sort((x,y)=>x-y).map(v=>fmt(v)).join(' &lt; ')}}]},
{t:'Sumar y restar decimales',u:4,learn:{h:'<p>Pon las <b>comas una debajo de otra</b> y suma como siempre.</p>',v:()=>svg(320,110,T(160,25,'  3,5',{s:28})+T(160,58,'+ 1,2',{s:28})+`<line x1="100" y1="78" x2="220" y2="78" stroke="currentColor" stroke-width="3"/>`+T(160,100,'  4,7',{s:28,c:'#16a34a'})),x:'3,5 + 1,2 = 4,7'},
 steps:['<b>2,6 + 1,3</b>','Comas en columna','Décimas: 6 + 3 = 9 · Unidades: 2 + 1 = 3','<b class="big">3,9</b>'],
 g:[()=>{const a=R(10,50)/10,b=R(1,40)/10;return{q:`<b class="big">${fmt(a,1)} + ${fmt(b,1)} = ?</b>`,vis:'',type:'num',ans:+(a+b).toFixed(1),hint:'Coma debajo de coma.',exp:`<b>${fmt(a+b,1)}</b>.`}},
  ()=>{const b=R(1,30)/10,a=+(b+R(5,40)/10).toFixed(1);return{q:`<b class="big">${fmt(a,1)} − ${fmt(b,1)} = ?</b>`,vis:'',type:'num',ans:+(a-b).toFixed(1),hint:'Coma debajo de coma.',exp:`<b>${fmt(a-b,1)}</b>.`}}]},
// ---------- UD 5 ----------
{t:'Tablas de proporcionalidad',u:5,learn:{h:'<p>Si <b>1</b> cuaderno cuesta <b>2 €</b>, 2 cuadernos cuestan 4 €, 3 cuestan 6 €…</p><p>Todo se multiplica por el <b>mismo número</b>.</p>',v:()=>V.table(['Cuadernos','1','2','3','4'],[['Precio (€)','2','4','6','8']]),x:'× 2 siempre'},
 steps:['1 entrada cuesta 5 €','¿Cuánto cuestan 4?','4 × 5','<b class="big">20 €</b>'],
 g:[()=>{const p=R(2,6),n=R(3,6);return{q:`Completa la tabla: ¿cuánto cuestan <b>${n}</b>?`,vis:V.table(['Unidades','1','2',String(n)],[['Precio (€)',String(p),String(2*p),'?']]),type:'num',ans:p*n,hint:`Cada una cuesta ${p} €.`,exp:`${n} × ${p} = <b>${n*p} €</b>.`}},
  ()=>{const p=R(2,5),n=R(2,4);return{q:`${n} helados cuestan ${n*p} €. ¿Cuánto cuesta <b>1</b>?`,vis:V.table(['Helados',String(n),'1'],[['Precio (€)',String(n*p),'?']]),type:'num',ans:p,hint:'Divide.',exp:`${n*p} : ${n} = <b>${p} €</b>.`}}]},
{t:'Porcentajes fáciles',u:5,learn:{h:'<p><b>%</b> significa "de cada 100".</p><p><b>50 %</b> = la mitad · <b>25 %</b> = la cuarta parte · <b>10 %</b> = dividir entre 10.</p>',v:()=>V.grid100(50,'#8b5cf6'),x:'50 de 100 = 50 % = la mitad'},
 steps:['<b>50 % de 40</b>','50 % es la mitad','40 : 2','<b class="big">20</b>'],lab:['percent'],
 g:[()=>{const k=pick([10,20,25,30,50,75]);return{q:'¿Qué porcentaje está pintado?',vis:V.grid100(k,pick(RC)),type:'num',ans:k,hint:'Cuenta las filas pintadas: cada fila es 10.',exp:`<b>${k} %</b>.`}},
  ()=>{const p=pick([50,25,10]),n=pick([20,40,60,80,100]);return{q:`¿Cuánto es el <b>${p} %</b> de ${n}?`,vis:V.grid100(p,'#22c55e'),type:'num',ans:n*p/100,hint:p===50?'La mitad.':p===25?'Divide entre 4.':'Divide entre 10.',exp:`<b>${n*p/100}</b>.`}},
  ()=>{const c=pick([20,40,60,80]);return{q:`Unas zapatillas cuestan ${c} € y tienen un <b>50 % de descuento</b>. ¿Cuánto pago?`,vis:V.grid100(50,'#ec4899'),type:'num',ans:c/2,hint:'Pagas la mitad.',exp:`<b>${c/2} €</b>.`}}]},
// ---------- UD 6 ----------
{t:'El número que falta',u:6,learn:{h:'<p>A veces falta un número: <b>□ + 3 = 8</b>.</p><p>Pregúntate: ¿qué número más 3 da 8? <b>5</b>.</p>',v:()=>V.balance(['x','1','1','1'],Array(8).fill('1')),x:'□ + 3 = 8 → □ = 5'},
 steps:['<b>□ + 4 = 10</b>','¿Qué número más 4 da 10?','Hago la contraria: 10 − 4','<b class="big">□ = 6</b>'],lab:['balance'],
 g:[()=>{const x=R(1,9),a=R(1,9);return{q:`<b class="big">□ + ${a} = ${x+a}</b>. ¿Qué número falta?`,vis:'',type:'num',ans:x,hint:`Resta: ${x+a} − ${a}.`,exp:`<b>${x}</b>.`}},
  ()=>{const x=R(2,9),a=R(2,5);return{q:`<b class="big">${a} × □ = ${a*x}</b>. ¿Qué número falta?`,vis:V.array(a,x,'#f97316'),type:'num',ans:x,hint:`Divide: ${a*x} : ${a}.`,exp:`<b>${x}</b>.`}}]},
{t:'Ecuaciones con la balanza',u:6,learn:{h:'<p>Una <b>ecuación</b> es como una <b>balanza</b> en equilibrio.</p><p>Si quito lo mismo de los dos lados, sigue en equilibrio. Así dejo la <b>x</b> sola.</p>',v:()=>V.balance(['x','1','1'],Array(7).fill('1')),x:'x + 2 = 7 → x = 5'},
 steps:['<b>x + 3 = 9</b>','Quito 3 bolitas de cada lado','Queda x = 9 − 3','<b class="big">x = 6</b>'],lab:['balance'],
 g:[()=>{const x=R(1,6),a=R(1,4);return{q:`¿Cuánto vale x? <b class="big">x + ${a} = ${x+a}</b>`,vis:V.balance(['x',...Array(a).fill('1')],Array(x+a).fill('1')),type:'num',ans:x,hint:`Quita ${a} bolitas de cada lado.`,exp:`x = ${x+a} − ${a} = <b>${x}</b>.`}},
  ()=>{const x=R(2,5),a=2;return{q:`¿Cuánto vale x? <b class="big">2x = ${2*x}</b>`,vis:V.balance(['x','x'],Array(2*x).fill('1')),type:'num',ans:x,hint:'Reparte las bolitas entre las dos x.',exp:`x = ${2*x} : 2 = <b>${x}</b>.`}}]},
{t:'Lenguaje algebraico',u:6,learn:{h:'<p>Usamos la letra <b>x</b> para "un número".</p><p>"El doble" → <b>2x</b>. "Un número más 5" → <b>x + 5</b>. "La mitad" → <b>x : 2</b>.</p>',v:()=>V.machine('× 2','x'),x:'el doble de x = 2x'},
 steps:['"El triple de un número"','Triple = × 3','Un número = x','<b class="big">3x</b>'],lab:['linear'],
 g:[()=>{const E=[['El doble de un número','2x'],['Un número más 5','x + 5'],['El triple de un número','3x'],['Un número menos 2','x − 2']],e=pick(E);return{q:`¿Cómo se escribe <b>${e[0].toLowerCase()}</b>?`,vis:'',type:'mc',opts:mc(e[1],shuffle(E.map(x=>x[1]))),ans:e[1],hint:'Doble → 2x. Triple → 3x. Más → +. Menos → −.',exp:`<b>${e[1]}</b>.`}},
  ()=>{const m=R(2,3),x=R(1,9);return{q:`Si x = ${x}, ¿cuánto vale <b>${m}x</b>?`,vis:V.machine(`× ${m}`,x),type:'num',ans:m*x,hint:`${m} × ${x}`,exp:`<b>${m*x}</b>.`}}]},
// ---------- UD 7 ----------
{t:'Coordenadas',u:7,learn:{h:'<p>Un punto se escribe <b>(x, y)</b>: primero cuánto a la <b>derecha</b>, luego cuánto <b>arriba</b>.</p><p>Truco: primero por el pasillo, luego subo la escalera.</p>',v:()=>V.coords([[3,5,'A(3, 5)']]),x:''},
 steps:['Punto <b>(4, 2)</b>','Empiezo en el 0','Ando <b>4</b> a la derecha','Subo <b>2</b>: ahí está el punto'],lab:['coords'],
 g:[()=>{const x=R(1,7),y=R(1,7),o=[`(${x}, ${y})`,`(${y}, ${x})`,`(${x+1}, ${y})`,`(${x}, ${y+1})`];return{q:'¿Cuáles son las coordenadas del punto P?',vis:V.coords([[x,y,'P']]),type:'mc',opts:mc(o[0],o.slice(1)),ans:o[0],hint:'Primero la x (derecha), luego la y (arriba).',exp:`<b>${o[0]}</b>.`}},
  ()=>{const x=R(1,7),y=R(1,7);return{q:'¿A qué <b>altura</b> (y) está el punto?',vis:V.coords([[x,y,'Q']]),type:'num',ans:y,hint:'Mira a la izquierda, en el eje vertical.',exp:`y = <b>${y}</b>.`}}]},
{t:'Leer gráficas',u:7,learn:{h:'<p>Una <b>gráfica</b> muestra cómo cambia algo. Si la línea <b>sube</b>, aumenta. Si <b>baja</b>, disminuye.</p>',v:()=>V.lineGraph(['L','M','X','J','V'],[12,15,11,18,16]),x:'Temperaturas de la semana'},
 steps:['¿Qué temperatura hubo el jueves?','Busco la J abajo','Subo hasta el punto','Miro a la izquierda: <b class="big">18 °C</b>'],
 g:[()=>{const d=['L','M','X','J','V'],v=d.map(()=>R(5,25)),i=R(0,4),N=['lunes','martes','miércoles','jueves','viernes'];return{q:`¿Qué temperatura hubo el <b>${N[i]}</b>?`,vis:V.lineGraph(d,v),type:'num',ans:v[i],hint:'Sube desde el día hasta el punto y mira a la izquierda.',exp:`<b>${v[i]} °C</b>.`}},
  ()=>{const up=Math.random()<.5;return{q:'La gráfica…',vis:V.lineGraph(['1','2','3','4','5'],up?[2,5,8,11,14]:[14,11,8,5,2]),type:'mc',opts:['sube (crece)','baja (decrece)'],fixed:true,ans:up?'sube (crece)':'baja (decrece)',hint:'Mírala de izquierda a derecha.',exp:`<b>${up?'Sube':'Baja'}</b>.`}}]},
{t:'De la tabla a la gráfica',u:7,learn:{h:'<p>Cada columna de una tabla es un <b>punto</b>: (x, y).</p>',v:()=>V.table(['x','1','2','3'],[['y','2','4','6']])+V.coords([[1,2],[2,4],[3,6]]),x:'(1, 2), (2, 4), (3, 6)'},
 steps:['Tabla: x = 2, y = 4','Punto (2, 4)','2 a la derecha, 4 arriba','Lo dibujo en la cuadrícula'],lab:['linear'],
 g:[()=>{const k=R(1,3),x=R(1,4);return{q:`En la tabla, ¿cuánto vale <b>y</b> cuando x = ${x+1}?`,vis:V.table(['x','1','2','3','4','5'],[['y',...[1,2,3,4,5].map(v=>v===x+1?'?':String(k*v))]]),type:'num',ans:k*(x+1),hint:`Cada vez que x sube 1, y sube ${k}.`,exp:`<b>${k*(x+1)}</b>.`}}]},
// ---------- UD 8 ----------
{t:'Contar datos',u:8,learn:{h:'<p>Para contar datos hacemos <b>palotes</b>: de 4 en 4 y el quinto los tacha. Así contamos de <b>5 en 5</b>.</p>',v:()=>V.tally(12),x:'12'},
 steps:['Veo 2 grupos tachados y 3 palotes','Cada grupo tachado = 5','5 + 5 + 3','<b class="big">13</b>'],
 g:[()=>{const n=R(3,17);return{q:'¿Cuántos palotes hay?',vis:V.tally(n),type:'num',ans:n,hint:'Cada grupo tachado vale 5.',exp:`<b>${n}</b>.`}},
  ()=>{const d=Array.from({length:10},()=>R(1,3)),v=R(1,3),f=d.filter(x=>x===v).length;return{q:`Datos: ${d.join(', ')}. ¿Cuántas veces sale el <b>${v}</b>?`,vis:'',type:'num',ans:f,hint:`Cuenta los ${v}.`,exp:`<b>${f}</b>.`}}]},
{t:'Gráficos de barras',u:8,learn:{h:'<p>En un gráfico de barras, cuanto <b>más alta</b> la barra, <b>más</b> hay. El número está a la <b>izquierda</b>.</p>',v:()=>V.barChart(['Fútbol','Baloncesto','Pádel'],[8,5,3]),x:'A 8 alumnos les gusta el fútbol'},
 steps:['¿Cuántos eligen pádel?','Busco la barra de pádel','Miro su altura a la izquierda','<b class="big">3</b>'],
 g:[()=>{const L=['Fútbol','Balonc.','Pádel','Natac.'],v=L.map(()=>R(1,10)),i=R(0,3);return{q:`¿Cuántos alumnos eligen <b>${['fútbol','baloncesto','pádel','natación'][i]}</b>?`,vis:V.barChart(L,v),type:'num',ans:v[i],hint:'Sube hasta lo alto de la barra y mira a la izquierda.',exp:`<b>${v[i]}</b>.`}},
  ()=>{const L=['Rojo','Azul','Verde','Amarillo'],v=shuffle([2,5,7,9]),mx=L[v.indexOf(9)];return{q:'¿Qué color es el <b>más</b> elegido?',vis:V.barChart(L,v),type:'mc',opts:L,fixed:true,ans:mx,hint:'La barra más alta.',exp:`<b>${mx}</b>.`}}]},
{t:'La media',u:8,learn:{h:'<p>La <b>media</b> es "repartir a partes iguales": sumo todo y divido entre cuántos hay.</p><p>Notas 4, 6 y 8: (4 + 6 + 8) : 3 = 18 : 3 = <b>6</b>.</p>',v:()=>V.barChart(['Ana','Luis','Eva'],[4,6,8]),x:'Media = 6'},
 steps:['Datos: 2, 4, 6','Sumo: 2 + 4 + 6 = 12','Hay 3 datos: 12 : 3','<b class="big">Media = 4</b>'],
 g:[()=>{const m=R(3,8),d=[m-1,m,m+1];return{q:`Calcula la media de <b>${shuffle(d).join(', ')}</b>.`,vis:V.barChart(['1.º','2.º','3.º'],d),type:'num',ans:m,hint:'Suma y divide entre 3.',exp:`${3*m} : 3 = <b>${m}</b>.`}},
  ()=>{const m=R(3,8),d=[m-2,m+2];return{q:`Calcula la media de <b>${d.join(' y ')}</b>.`,vis:V.barChart(['A','B'],d),type:'num',ans:m,hint:'Suma y divide entre 2.',exp:`${2*m} : 2 = <b>${m}</b>.`}}]},
{t:'¿Seguro, posible o imposible?',u:8,learn:{h:'<p><b>Seguro</b>: pasa siempre. <b>Posible</b>: puede pasar. <b>Imposible</b>: no pasa nunca.</p>',v:()=>V.bag([['#ef4444',3],['#3b82f6',2]]),x:'Sacar verde de esta bolsa es imposible'},
 steps:['Bolsa: 3 rojas y 2 azules','¿Sacar roja?','Hay rojas, pero también azules','<b class="big">Posible</b>'],lab:['bag'],
 g:[()=>{const r=R(1,4),b=R(0,3),c=pick(['roja','azul','verde']);const k=c==='verde'||(c==='azul'&&b===0)?'Imposible':(c==='roja'&&b===0)?'Seguro':'Posible';return{q:`Saco una bola sin mirar. Sacar una bola <b>${c}</b> es…`,vis:V.bag([['#ef4444',r],['#3b82f6',b]]),type:'mc',opts:['Seguro','Posible','Imposible'],fixed:true,ans:k,hint:'Mira qué colores hay en la bolsa.',exp:`<b>${k}</b>.`}},
  ()=>{const w=pick([['un 6',1],['un número par',3],['un número menor que 3',2]]);return{q:`Lanzo un dado. ¿Cuántas caras dan <b>${w[0]}</b>?`,vis:[1,2,3,4,5,6].map(n=>V.dice(n)).join(''),type:'num',ans:w[1],hint:'Cuenta las caras que valen.',exp:`<b>${w[1]}</b> de 6.`}}]},
// ---------- Refuerzo ----------
{t:'Medir con la regla',u:9,learn:{h:'<p>Para medir, pon el <b>0</b> de la regla al principio del objeto y mira dónde <b>acaba</b>.</p><p>1 metro = 100 cm.</p>',v:()=>V.ruler(10,7),x:'El lápiz mide 7 cm'},
 steps:['Pongo el 0 al principio del lápiz','Miro dónde acaba la punta','En el número 9','<b class="big">9 cm</b>'],lab:['ruler'],
 g:[()=>{const l=R(2,11);return{q:'¿Cuántos centímetros mide el lápiz?',vis:V.ruler(12,l,pick(RC)),type:'num',ans:l,hint:'Mira el número donde acaba la punta.',exp:`<b>${l} cm</b>.`}},
  ()=>{const m=R(1,5);return{q:`¿Cuántos centímetros son <b>${m} m</b>?`,vis:'',type:'num',ans:100*m,hint:'1 m = 100 cm.',exp:`<b>${100*m} cm</b>.`}}]},
{t:'Perímetro',u:9,learn:{h:'<p>El <b>perímetro</b> es lo que mide el <b>borde</b>. Sumo <b>todos los lados</b>.</p>',v:()=>V.rect(5,3,'cm','#a78bfa'),x:'5 + 3 + 5 + 3 = 16 cm'},
 steps:['Rectángulo de 6 cm y 2 cm','Tiene 4 lados: 6, 2, 6, 2','Sumo: 6 + 2 + 6 + 2','<b class="big">16 cm</b>'],lab:['area'],
 g:[()=>{const w=R(2,8),h=R(1,5);return{q:'¿Cuál es el perímetro? (suma los 4 lados)',vis:V.rect(w,h,'cm','#fde68a'),type:'num',ans:2*(w+h),hint:`${w} + ${h} + ${w} + ${h}`,exp:`<b>${2*(w+h)} cm</b>.`}},
  ()=>{const s=R(2,9);return{q:`Un cuadrado tiene lados de ${s} cm. ¿Perímetro?`,vis:V.squares(Math.min(s,6),'#f472b6'),type:'num',ans:4*s,hint:'4 lados iguales.',exp:`4 × ${s} = <b>${4*s} cm</b>.`}}]},
{t:'Área contando cuadraditos',u:9,learn:{h:'<p>El <b>área</b> es lo que ocupa <b>por dentro</b>. Se cuenta en cuadraditos.</p><p>Truco: filas × columnas.</p>',v:()=>V.rect(4,3,'cm','#4ade80',true),x:'4 × 3 = 12 cuadraditos = 12 cm²'},
 steps:['Rectángulo de 5 × 2','2 filas de 5 cuadraditos','5 × 2','<b class="big">10 cm²</b>'],lab:['area'],
 g:[()=>{const w=R(2,7),h=R(2,5);return{q:'¿Cuántos cuadraditos tiene? (área)',vis:V.rect(w,h,'cm','#4ade80',true),type:'num',ans:w*h,hint:'Cuenta una fila y multiplica por las filas.',exp:`${w} × ${h} = <b>${w*h} cm²</b>.`}}]},
{t:'Ángulos',u:9,learn:{h:'<p>El ángulo <b>recto</b> es como la esquina de un folio (90°). Si es más cerrado, es <b>agudo</b>. Si es más abierto, <b>obtuso</b>.</p>',v:()=>V.angle(90)+V.angle(40)+V.angle(130),x:'Recto · agudo · obtuso'},
 steps:['Pongo la esquina de un folio sobre el ángulo','Si coincide: <b>recto</b>','Si es más cerrado: <b>agudo</b>','Si es más abierto: <b>obtuso</b>'],lab:['angle'],
 g:[()=>{const d=pick([30,45,60,90,90,120,135,150]),t=d<90?'Agudo':d===90?'Recto':'Obtuso';return{q:'¿Qué tipo de ángulo es?',vis:V.angle(d),type:'mc',opts:['Agudo','Recto','Obtuso'],fixed:true,ans:t,hint:'Compáralo con la esquina de un folio.',exp:`<b>${t}</b>.`}}]}
];

{t:'Operaciones y jerarquía',learn:{h:'<p>Orden para operar:</p><p><b>1.º</b> Paréntesis. <b>2.º</b> Multiplicaciones y divisiones (de izquierda a derecha). <b>3.º</b> Sumas y restas.</p>',v:()=>svg(380,70,T(190,35,'5 + 3 · 4 = 5 + 12 = 17',{s:26})),x:'¡Ojo! No es 8 · 4 = 32'},
 g:[()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return{q:`<b class="big">${a} + ${b} · ${c} = ?</b>`,vis:'',type:'num',ans:a+b*c,hint:'Primero la multiplicación.',exp:`${a} + ${b*c} = <b>${a+b*c}</b>.`}},

  ()=>{const b=R(2,5),e=R(2,4);return{q:`<b class="big">${b}<sup>${e}</sup> = ?</b>`,vis:'',type:'num',ans:b**e,hint:`Multiplica el ${b} por sí mismo ${e} veces.`,exp:`${Array(e).fill(b).join(' · ')} = <b>${b**e}</b>.`}},

{t:'Números enteros: la recta',learn:{h:'<p>Los números <b class="c-r">negativos</b> están a la izquierda del 0 (bajo cero, deudas, plantas de sótano). Los <b class="c-b">positivos</b> a la derecha.</p><p>Cuanto más a la <b>derecha</b>, mayor: −2 &gt; −5.</p>',v:()=>V.line(-5,5,{points:[{v:-3,t:'−3',c:'#dc2626'},{v:2,t:'+2',c:'#2563eb'}]}),x:'−3 &lt; 2'},

function E1_build(min){const out=[],units=[];const oldT=new Set(SES_OLD.map(s=>s.t));const used=new Set();
  E1_UD.forEach((name,i)=>{const k=i+1,ts=[];
    for(const[src,t]of E1_MAP[k]){if(min&&src==='A')continue;
      const base=(src==='B'?SES_V5:SES_OLD).find(x=>x.t===t);if(!base)throw new Error('Falta '+t);const s=Object.assign({},base);
      if(src==='B'&&!min&&oldT.has(t))s.t=t+' · primeros pasos';
      if(src==='A'&&typeof LABMAP!=='undefined'){if(LABMAP[t])s.lab=LABMAP[t];if(STEPS[t])s.steps=STEPS[t]}
      s.es=min?'':src==='B'?'Nivel básico':'Avanza';if(used.has(s.t))continue;used.add(s.t);out.push(s);ts.push(s.t)}
    for(const s of ((min?E1_MIN_EXTRA:E1_EXTRA)[k]||[])){out.push(s);ts.push(s.t)}
    for(const s of ((min?E1_MIN_COMBOS:E1_COMBOS)[k]||[])){out.push(s);ts.push(s.t)}
    units.push([name,ts])});
  return{S:out,U:units}}

function hint2(q){const a=q.ans;

  if(q.type==='combo'){fb('hint',`<b>${L.hint}:</b> ${q.hint}`+(Q.hl>=2&&q.hintNow?`<br>${q.hintNow()} Te la marco parpadeando.`:''));if(Q.hl>=2)$('#hint').disabled=true;return}

function direction(q,v){if(q.type==='shade'){const n=+v,a=+q.ans;return n>a?L.tooMany:n<a?L.tooFew:''}
  if(q.type==='num'||!q.type){const a=num(v),b=typeof q.ans==='number'?q.ans:num(q.ans);if(isFinite(a)&&isFinite(b)&&!q.exact)return a>b?L.tooBig:L.tooSmall}return ''}
function check(v,btn){const q=Q.qs[Q.k];let ok;

  const d=day(),secs=Math.min(300,(Date.now()-Q.qt0)/1000);
  if(ok){Q.locked=true;const pts=[1,.6,.3][Q.tries-1]*(Q.usedHint?.8:1);Q.score+=pts;addXP(Math.round(pts*10));if(Q.tries===1){Q.ok1++;d.c++}d.a++;d.s+=secs;
    q.res=Q.tries===1?'ok':'half';if(btn)btn.classList.add('good');else if($('#disp'))$('#disp').classList.add('good');
    fb('ok',`<b>${pick(L.praise)}</b> ${q.exp}`);if(Q.tries===1&&!Q.usedHint)confetti();end()}
  else if(Q.tries<MAXT){const dir=direction(q,v);
    if(btn){btn.classList.add('bad');btn.disabled=true}else if($('#disp')){$('#disp').classList.add('bad');setTimeout(()=>{const e=$('#disp');if(e){e.classList.remove('bad');Q.input='';e.innerHTML='&nbsp;'}},800)}
    if(q.type==='order'){Q.seq=[];Q.drawOrd&&Q.drawOrd()}
    Q.hl=Q.tries-1;const extra=Q.tries===1?q.hint:hint2(q);Q.hl=Q.tries;
    fb('try',`<b>${L.again}</b> ${dir?`<span class="dir">${dir}</span> `:''}<br><b>${L.hint} ${Q.tries}:</b> ${extra}`);if(Q.tries>=2)$('#hint').disabled=true}
  else{Q.locked=true;q.res='no';d.a++;d.s+=secs;Q.wrong.push(strip(q.q)+' → '+(Array.isArray(q.ans)?q.ans.join(', '):String(q.ans)));if(btn)btn.classList.add('bad');else if($('#disp'))$('#disp').classList.add('bad');

      const D=pz.querySelector('#disp');
      Q.comboPad={press(k){let t=Q.input;if(k==='⌫')t=t.slice(0,-1);else if(k==='−')t=t.startsWith('-')?t.slice(1):'-'+t;else if(t.length<10)t+=k;Q.input=t;D.textContent=t.replace('-','−')||' '},
        ok(){if(Q.input==='')return;const r=cb(Q.input);if(r){Q.comboPad=null;pz.innerHTML=''}else{D.classList.add('bad');setTimeout(()=>{D.classList.remove('bad');Q.input='';D.innerHTML='&nbsp;'},700)}}};
      pz.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k));pz.querySelector('#cok').onclick=()=>Q.comboPad&&Q.comboPad.ok()},
    msg(kind,h){fb(kind,h)},
    done(m,fails,resH){multiDone(q,m,fails,resH)}})}
function multiDone(q,m,fails,resH){const d=day(),secs=Math.min(600,(Date.now()-Q.qt0)/1000);Q.locked=true;Q.tries=Math.min(3,m+1);d.a++;d.s+=secs;
  if(m<=2){const pts=[1,.6,.3][m]*(Q.usedHint?.8:1);Q.score+=pts;addXP(Math.round(pts*10));if(m===0){Q.ok1++;d.c++}q.res=m===0?'ok':'half';
    fb('ok',`<b>${pick(L.praise)}</b> Resultado final: <b>${resH}</b>.`+(m?` <span class="small">(${m} tropiezo${m>1?'s':''} por el camino)</span>`:''));if(m===0&&!Q.usedHint)confetti(40)}
  else{q.res='no';Q.wrong.push((q.expr?exTxt(q.expr):q.n)+' = '+strip(resH)+' · '+[...new Set(fails)].slice(0,3).join('; '));fb('no',`Resultado final: <b>${resH}</b>. ${L.noWorry}`)}
  beep(m<=2);save();$('#hint').hidden=true;$('#nx').hidden=false;$('#nx').focus()}
// ---------- Escalera de factores primos (manipulativa) ----------
function treeAsk(z,q){let n=q.n,m=0;const rows=[],fails=[],P=[2,3,5,7,11,13];
  const fact=()=>{const c={};rows.forEach(r=>c[r[1]]=(c[r[1]]||0)+1);return Object.keys(c).map(p=>p+(c[p]>1?`<sup>${c[p]}</sup>`:'')).join(' · ')};
  function draw(last){z.innerHTML=`<div class="ladder">${rows.map((r,i)=>`<div class="lrow ${i===rows.length-1&&last?'new':''}"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}<div class="lrow cur"><b>${n}</b><span>${n===1?'':'?'}</span></div></div>
    ${n>1?`<p class="inst">¿Entre qué primo divides <b>${n}</b>?</p><div class="opts primes">${P.map(p=>`<button class="opt" data-p="${p}">${p}</button>`).join('')}</div>`:`<p class="inst">${q.n} = ${fact()}</p>`}`;
    z.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(Q.locked)return;const p=+b.dataset.p;
      if(n%p===0){rows.push([n,p]);n/=p;beep(true);fb('ok',`${rows[rows.length-1][0]} : ${p} = <b>${n}</b>`);draw(true);if(n===1)setTimeout(()=>multiDone(q,m,fails,`${q.n} = ${fact()}`),500)}
      else{m++;fails.push(`${n} no es divisible entre ${p}`);b.classList.add('bad');b.disabled=true;beep(false);fb('try',`${n} no se puede dividir exacto entre ${p}. ${q.hint}`)}})}
  draw(false)}
// ---------- Reto relámpago: 90 segundos de cálculo rápido ----------
function reto(){if(Q&&!Q.saved)savePartial();Q=null;const pool=S.filter(s=>!s.mix&&!isLocked(s)&&!s.combo).flatMap(s=>s.g.map(g=>[s,g]));if(!pool.length)return;
  const DUR=90,t0=Date.now();let ok=0,n=0,cur=null,inp='',tm=null,over=false;const wrong=[];
  const pickQ=()=>{for(let k=0;k<60;k++){const[s,g]=pick(pool);const q=g();if(q&&(q.type==='mc'||q.type==='num'))return q}return null};
  function draw(){cur=pickQ();inp='';if(!cur){end();return}
    app.innerHTML=`<div class="top band"><button class="icon" id="hm">${ico.back}</button><h2>⚡ Reto relámpago</h2><span class="cnt" id="rtm">${DUR} s</span><span class="cnt">✔ ${ok}</span></div>
     <section class="band"><div class="card qcard" style="--c:#f59e0b"><p class="qt">${cur.q}</p>${cur.vis?`<div class="visbox">${cur.vis}</div>`:''}<div id="rz"></div><div id="fb" class="fb" hidden></div></div></section>`;
    const z=$('#rz');$('#hm').onclick=()=>{clearInterval(tm);home()};
    if(cur.type==='mc'){z.innerHTML=`<div class="opts ${cur.opts.length<=3?'o3':''}">${cur.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${showFr(String(o))}</button>`).join('')}</div>`;z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.v,b))}
    else{z.innerHTML=`<div class="disp" id="disp">&nbsp;</div><div class="pad">${A.keys.map(k=>`<button class="key ${k==='⌫'?'del':''}" data-k="${k}">${k}</button>`).join('')}</div><div class="row c"><button class="cta big" id="rok">${L.check}</button></div>`;
      z.querySelectorAll('.key').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')inp=inp.slice(0,-1);else if(k==='−')inp=inp.startsWith('-')?inp.slice(1):'-'+inp;else if(inp.length<10)inp+=k;$('#disp').textContent=inp.replace('-','−')||' '});
      $('#rok').onclick=()=>{if(inp!=='')answer(inp)}}}
  function answer(v,btn){if(over)return;n++;const q=cur;let good;if(q.type==='mc')good=String(v)===String(q.ans);else{const a=num(v),b=typeof q.ans==='number'?q.ans:num(q.ans);good=isFinite(a)&&Math.abs(a-b)<1e-9}
    beep(good);if(good){ok++;addXP(5);if(btn)btn.classList.add('good');fb('ok','<b>¡Bien!</b>');setTimeout(draw,450)}
    else{wrong.push(strip(q.q)+' → '+q.ans);if(btn)btn.classList.add('bad');fb('no',`Era <b>${showFr(String(q.ans))}</b>.`);setTimeout(draw,1300)}}
  function end(){over=true;clearInterval(tm);const best=Math.max(store.reto||0,ok),rec=ok>(store.reto||0)&&ok>0;store.reto=best;
    const r={t:'⚡ Reto relámpago',u:'Reto',d:new Date(t0).toISOString(),dur:Math.round((Date.now()-t0)/1000),n,sc:ok,p:pc(ok,n),ok1:ok,h:0,w:wrong.slice(0,10),partial:false};store.log.unshift(r);const dd=day();dd.a+=n;dd.c+=ok;dd.s+=r.dur;save();autoSend();
    app.innerHTML=`<section class="band endb"><div class="card end" style="--c:#f59e0b"><p class="tag">⚡ Reto relámpago</p><h2>${rec?'¡Nuevo récord!':ok>=5?'¡Muy rápido!':'¡Buen intento!'}</h2><p class="sc"><b>${ok}</b> aciertos de ${n} en ${DUR} segundos</p><p>Tu récord: <b>${best}</b></p>
     <div class="row c"><button class="ghost big" id="again">Otra vez</button><button class="cta big" id="hm">${L.menu}</button></div></div></section>`;if(rec||ok>=5)confetti(60);$('#again').onclick=reto;$('#hm').onclick=home}
  tm=setInterval(()=>{const left=Math.max(0,DUR-Math.round((Date.now()-t0)/1000));const e=$('#rtm');if(e)e.textContent=left+' s';if(left<=0)end()},500);draw()}
// ---------- Portada personal ----------
function cover(){if(Q&&!Q.saved)savePartial();const nm=A.fullName||A.name;const ini=nm.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('');
  const sym=['π','√','÷','×','½','∑','%','x²','∞','=','+','¾','△','7','3'];
  app.innerHTML=`<section class="cover">${A.coverImg?`<img class="cvbg" src="${A.coverImg}" alt="">`:''}<div class="cvshade"></div><div class="cvmath" aria-hidden="true">${sym.map((c,i)=>`<i style="left:${(i*37)%92+3}%;top:${(i*53)%80+6}%;animation-delay:${(i%7)*.6}s;font-size:${28+(i*13)%40}px">${c}</i>`).join('')}</div>
   <div class="cvcard"><div class="cvph">${A.photo?`<img src="${A.photo}" alt="Foto de ${esc(nm)}">`:`<span>${esc(ini)}</span>`}</div>
    <p class="cvk">${esc(A.sub)}</p><h1 class="cvn">${esc(nm)}</h1>${A.group?`<p class="cvg">${esc(A.group)} · IES Tolosa · La Línea</p>`:''}
    <button class="cta huge" id="go">¡Empieza! ▶</button><p class="cvf">MOTO-MATES · David Cortés Chaparro</p></div></section>`;
  $('#go').onclick=()=>{beep(true);home()};window.scrollTo(0,0)}
// ---------- ¿Quién eres? ----------
function whoScreen(){if(Q&&!Q.saved)savePartial();if(A.cover){cover();return}const ps=profiles();
  app.innerHTML=`<section class="band endb"><div class="card end who" style="--c:var(--cta)"><p class="tag">${esc(A.sub)}</p><h2>${L.whoQ}</h2>
   <button class="cta big mainwho" id="me">${esc(A.name)}</button>
   ${ps.length?`<p class="small">${L.whoUsed}</p><div class="whol">${ps.map(p=>`<button class="ghost" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}
   <form id="wf" class="wf"><label for="wn">${L.whoOther}</label><input id="wn" autocomplete="off" autocapitalize="words" maxlength="40" placeholder="${L.whoPh}"><button class="ghost big" type="submit">${L.whoGo}</button></form>
   <p class="small warn" id="wm"></p></div></section>`;
  $('#me').onclick=()=>{login(A.name);home()};
  app.querySelectorAll('.whol button').forEach(b=>b.onclick=()=>{login(b.dataset.p);home()});
  $('#wf').addEventListener('submit',e=>{e.preventDefault();let n=$('#wn').value.trim().replace(/\s+/g,' ');if(n.length<3){$('#wm').textContent=L.whoShort;return}
    n=n.split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');if(n.toLowerCase()===A.name.toLowerCase())n=A.name;login(n);home()});window.scrollTo(0,0)}
if(A.cover){login(A.name);store.opens=(store.opens||0)+1;store.lastOpen=new Date().toISOString();save();cover()}else{const w=ls.get(BASE+'-who');if(w){login(w);home()}else whoScreen()}
}
(window.APP.init?Promise.resolve().then(()=>window.APP.init()):Promise.resolve()).then(()=>BOOT(),e=>{console.error(e)});
