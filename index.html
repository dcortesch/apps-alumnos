<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;font:18px/1.45 "Baloo 2",system-ui,sans-serif;color:#0b2545;background:#fffaf0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hero{position:relative;min-height:300px;display:grid;align-items:end;overflow:hidden;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 40%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,37,69,0) 30%,rgba(11,37,69,.8))}
.hero div{position:relative;z-index:1;padding:24px max(4vw,16px)}
.hero h1{margin:0;font-size:clamp(36px,6vw,60px);line-height:1}.hero p{margin:4px 0 0;font-weight:700;font-size:20px}
.math{position:absolute;inset:0;z-index:1;pointer-events:none}.math i{position:absolute;font-style:normal;font-weight:800;color:rgba(255,255,255,.6);text-shadow:0 2px 8px rgba(0,0,0,.4);animation:f 7s ease-in-out infinite}@keyframes f{50%{transform:translateY(-14px) rotate(8deg)}}
main{padding:22px max(4vw,16px) 40px}h2{margin:18px 0 12px;font-size:26px;border-left:6px solid #ff7a00;padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
a.al{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit;background:#fff;border:3px solid #dbe7f5;border-radius:24px;padding:14px 10px;box-shadow:0 5px 0 #dbe7f5;text-align:center}
a.al:active{transform:translateY(3px);box-shadow:none}
a.al .ph{width:96px;height:96px;border-radius:50%;overflow:hidden;border:4px solid #0b4f8a;background:linear-gradient(135deg,#2b7de9,#e8368f);display:grid;place-items:center;color:#fff;font-weight:800;font-size:34px}
a.al .ph img{width:100%;height:100%;object-fit:cover}a.al b{font-size:18px;line-height:1.15}a.al span{font-size:13px;font-weight:700;color:#64748b}
a.al.min{border-color:#fbbf24;box-shadow:0 5px 0 #fbbf24}a.al.own{border-color:#e8368f;box-shadow:0 5px 0 #e8368f}
.lock{max-width:560px;margin:40px auto;background:#fff;border-radius:24px;padding:28px;text-align:center;border:3px solid #dbe7f5}
.cfg{background:#e0f2fe;border-radius:18px;padding:12px 16px;font-weight:700}
</style></head><body>

<script>
const VAULT={b64u:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))},
 async open(dir,lsKey){const m=location.hash.match(/k=([\w-]+)\.([\w-]+)/);let tok=m?m[1]+'.'+m[2]:null;try{if(tok)localStorage.setItem(lsKey,tok);else tok=localStorage.getItem(lsKey)}catch(e){}
  if(!tok||!crypto.subtle)return null;const[id,key]=tok.split('.');const r=await fetch(dir+id+'.bin',{cache:'no-cache'});if(!r.ok)return null;const buf=new Uint8Array(await r.arrayBuffer());
  const k=await crypto.subtle.importKey('raw',VAULT.b64u(key),'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12));return Object.assign(JSON.parse(new TextDecoder().decode(pt)),{id})}};

(async()=>{const M=document.getElementById('m');let d=null;
  const m=location.hash.match(/k=([\w-]+)\.([\w-]+)/);
  if(m){try{d=await VAULT.open('./','profe-k')}catch(e){}}else{try{if(localStorage.getItem('profe-k'))d=await VAULT.open('./','profe-k')}catch(e){}}
  if(!d){M.innerHTML='<div class="lock"><h2 style="border:0;padding:0">Página del profesor</h2><p>Ábrela con tu <b>enlace de profesor</b>. Los alumnos entran con su enlace personal.</p></div>';return}
  let c=null,c3=null;try{c=await fetch('1eso-e/config.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())}catch(e){}try{c3=await fetch('3eso/config.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())}catch(e){}

   ${d.b?`<h2>3.º ESO B · ${d.b.length} alumnos</h2><div class="grid">${d.b.map(a=>card(a,'')).join('')}</div>`:''}
