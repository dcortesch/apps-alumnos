<style>
/* VOICE: cuaderno de juego para un alumno concreto, cálido y claro

   COLOUR and TYPE: color dominante del alumno en la banda, acento fuerte en los botones; tipografía redonda y grande
   LAYOUT: banda superior con nombre y escena; rejilla de sesiones; práctica a una columna con teclado táctil */
:root{color-scheme:light dark;--bg:light-dark(#eaf3fb,#10151f);--ink:light-dark(#14213d,#eef2ff);--card:light-dark(#ffffff,#1a2233);--line:light-dark(#d9e1ee,#2c3850);--band:#0f3d5e;--bandink:#ffffff;--cta:#ff7a00;--ctaink:#fff;--soft:light-dark(#e7eef8,#222c42)}

.tot{margin:0;display:flex;align-items:center;gap:6px;font-size:18px}.tot .st{width:26px;height:26px}
.hero-v svg{width:100%;height:auto;display:block}
h2{font-size:26px;line-height:1.15;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

.bigstars .st{width:min(90px,22vw);height:min(90px,22vw)}.sc{font-size:24px;font-weight:700}.end .row{justify-content:center}
.c-u{color:#ea580c}.c-d{color:#16a34a}.c-c{color:#2563eb}.c-r{color:#dc2626}.c-b{color:#2563eb}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:22px;padding:22px;max-width:980px;width:100%;max-height:90vh;overflow:auto}
.small{font-size:14px;opacity:.8}.sum{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.sum span{display:inline-flex;align-items:center;gap:2px;font-weight:700;background:var(--soft);border-radius:10px;padding:4px 8px}.sum .st{width:16px;height:16px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}td.r{text-align:right;white-space:nowrap}td.w{font-size:13px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
html,body{overscroll-behavior:none}
button,.ses,.key,.opt,.sl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}

@media (min-width:1000px) and (orientation:landscape){.qbody.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:center}.qbody.two .visbox{margin:6px 0}.card{max-width:1120px}}

.endbtn{display:inline-flex;align-items:center;gap:6px;min-height:48px;border-radius:14px;border:2px solid currentColor;background:rgba(255,255,255,.15);color:inherit;font-weight:800;padding:6px 14px;flex:none;margin-left:auto}
.hero .endbtn{margin-left:0;color:var(--bandink)}.row.l{justify-content:flex-start;margin-top:14px}.row.sb{justify-content:space-between;align-items:center;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding-block:18px}.stats.in{padding:0;margin:14px 0}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.kpi b{font-size:26px;line-height:1.1}.kpi span{font-size:14px;opacity:.75}
.bar{display:block;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--cta);border-radius:6px;transition:width .6s}
.unith{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:26px 0 12px}.unith .unit{margin:0}.unith .up{font-weight:700;font-size:15px;opacity:.8;justify-self:end}.unith .bar{grid-column:1/-1;margin:0}
.ses.done{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}.ss em{font-style:normal;font-size:13px;font-weight:700;margin-left:6px;opacity:.7}

.dir{display:inline-block;font-weight:800}.opt.off{opacity:.25}
.wl{text-align:left;margin:10px 0;background:var(--soft);border-radius:14px;padding:10px 14px}.wl summary{font-weight:800;cursor:pointer}.wl li{margin:4px 0}
.sendst{font-weight:700;font-size:18px}.okk{color:#15803d}.warn{color:#b45309}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:140px;margin-bottom:8px}.days div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.days i{display:block;width:70%;background:var(--cta);border-radius:6px 6px 0 0;min-height:2px}.days span{font-size:11px;margin-top:4px}
.ut{width:100%;border-collapse:collapse;font-size:15px}.ut th,.ut td{border-bottom:1px solid var(--line);padding:6px}.tf{margin:0;padding-left:20px}
.mbox h3{font-size:18px;margin:18px 0 8px}
.unit{font-size:22px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--cta)}
.ses.rev{background:var(--soft)}
.labbox .ghost{background:var(--card);border:2px solid var(--line)}
.labbox{background:var(--soft);border-radius:22px;padding:16px;margin-top:16px}
.labv{background:#fff;color:#0f172a;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:120px}
.labr{text-align:center;font-size:22px;margin:10px 0}
.sl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 56px;gap:10px;align-items:center;margin:8px 0;font-weight:700;font-size:16px}
.sl b{text-align:center;font-size:20px;background:var(--card);border-radius:10px;padding:4px}
input[type=range]{width:100%;height:44px;accent-color:var(--cta)}
.steps{display:grid;gap:8px;min-height:60px}.step{font-size:24px;text-align:center;padding:10px;border-radius:14px;background:var(--card)}
.step.old{opacity:.55;font-size:20px}.step.new{animation:pop .6s cubic-bezier(.2,.9,.3,1.3);border:3px solid var(--cta)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.glt{width:100%;border-collapse:collapse;font-size:17px}.glt th{background:var(--c);color:#fff;text-align:left;padding:6px 10px}.glt td{padding:6px 10px;border-bottom:1px solid var(--line)}
.vt{border-collapse:collapse;font-size:18px;background:#fff;color:#0f172a}.vt th,.vt td{border:2px solid #94a3b8;padding:6px 14px;text-align:center}.vt th{background:#e0e7ff}
.inst{text-align:center;font-weight:700;font-size:19px;margin:6px 0}

<script>
// ===== Utilidades y dibujos SVG comunes (sin DOM) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const fmt=(x,dec)=>{let s=(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));return s.replace('.',',')};
const fmtEN=(x,dec)=>(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));
const miles=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const thou=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sg=n=>n<0?`(${n})`:`${n}`; // entero con paréntesis si negativo
// opciones de elección múltiple únicas a partir de la correcta y distractores
function mc(ans,dis,n=4){const s=[String(ans)];for(const d of dis){const v=String(d);if(!s.includes(v)&&s.length<n)s.push(v)}return shuffle(s)}
function near(ans,spread=3,n=4,allowNeg=false){const d=[];let g=0;while(d.length<n*3&&g++<200){const v=ans+R(-spread,spread);if(v!==ans&&(allowNeg||v>=0))d.push(v)}return d}

const PAL=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
const svg=(w,h,body,cls='')=>`<svg class="vis ${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||16}" font-weight="${o.w||700}" fill="${o.c||'currentColor'}" text-anchor="${o.a||'middle'}" dominant-baseline="middle" font-family="inherit">${t}</text>`;

const V={
  // bloques multibase: centenas, decenas, unidades
  blocks(c,d,u){const s=7,P=[];let x=10;
    for(let i=0;i<c;i++){let g=`<rect x="${x}" y="10" width="${s*10}" height="${s*10}" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x+k*s} 10v${s*10}M${x} ${10+k*s}h${s*10}" stroke="#1e3a8a" stroke-opacity=".45"/>`;P.push(g);x+=s*10+12}
    for(let i=0;i<d;i++){let g=`<rect x="${x}" y="10" width="${s}" height="${s*10}" rx="2" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x} ${10+k*s}h${s}" stroke="#14532d" stroke-opacity=".5"/>`;P.push(g);x+=s+7}
    if(d)x+=6;
    for(let i=0;i<u;i++){P.push(`<rect x="${x}" y="${10+s*9}" width="${s}" height="${s}" rx="1.5" fill="#f97316" stroke="#7c2d12" stroke-width="1.2"/>`);x+=s+5}
    return svg(Math.max(x+10,120),s*10+22,P.join(''))},
  // objetos sencillos para contar
  icon(kind,x,y,r=12,c){const col=c||({apple:'#ef4444',star:'#eab308',ball:'#3b82f6',fish:'#06b6d4',flower:'#ec4899',cookie:'#b45309'})[kind]||'#8b5cf6';
    if(kind==='star'){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${p}Z" fill="${col}" stroke="#854d0e" stroke-width="1"/>`}
    if(kind==='apple')return `<circle cx="${x}" cy="${y+1}" r="${r*.9}" fill="${col}"/><path d="M${x} ${y-r*.8}q2 -6 7 -7" stroke="#166534" stroke-width="2.5" fill="none"/><circle cx="${x-r*.35}" cy="${y-r*.2}" r="${r*.2}" fill="#fff" opacity=".5"/>`;

{t:'La recta de los enteros',u:2,learn:{h:'<p>En la recta, los <b class="c-r">negativos</b> están a la <b>izquierda</b> del 0 y los <b class="c-b">positivos</b> a la derecha.</p><p>Cuanto más a la <b>derecha</b>, más grande.</p>',v:()=>V.line(-6,6,{points:[{v:-4,t:'−4',c:'#dc2626'},{v:3,t:'+3',c:'#2563eb'}]}),x:'−4 &lt; 3'},

 g:[()=>{const v=R(-7,7)||3;return{q:'¿Qué número señala el punto rojo?',vis:V.line(-8,8,{points:[{v}],hide:[v]}),type:'num',ans:v,hint:'Cuenta las rayitas desde el 0. A la izquierda es negativo.',exp:`<b>${v}</b>.`}},
  ()=>{let a=R(-9,9),b=R(-9,9);if(a===b)b=a+1;const s=a>b?'>':'<';return{q:`Elige el signo: <b class="big">${a} ☐ ${b}</b>`,vis:V.line(-10,10,{step:2,points:[{v:a,c:'#8b5cf6',t:a},{v:b,c:'#f97316',t:b}]}),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'El que está más a la derecha es mayor.',exp:`${a} ${s} ${b}`}},
  ()=>{const ns=[];while(ns.length<4){const v=R(-9,9);if(!ns.includes(v))ns.push(v)}return{q:'Ordena de <b>menor a mayor</b>.',vis:V.line(-10,10,{step:2}),type:'order',items:shuffle(ns.map(String)),ans:ns.slice().sort((x,y)=>x-y).map(String),hint:'Los negativos van primero.',exp:ns.slice().sort((x,y)=>x-y).join(' &lt; ')}}]},
{t:'Sumar enteros con la recta',u:2,learn:{h:'<p>Para sumar en la recta: me pongo en el primer número y <b>salto</b>.</p><p>Sumar un número <b>positivo</b> → salto a la <b>derecha</b>. Sumar un <b>negativo</b> → salto a la <b>izquierda</b>.</p>',v:()=>V.line(-4,4,{jumps:[{from:-3,to:2,t:'+5'}],points:[{v:2,t:'2',c:'#16a34a'}]}),x:'−3 + 5 = 2'},
 steps:['<b>−2 + 6</b>','Me pongo en el −2','Salto 6 a la derecha: −1, 0, 1, 2, 3, 4','<b class="big">= 4</b>'],lab:['numline'],
 g:[()=>{const a=R(-6,3),b=R(1,6);return{q:`<b class="big">${a} + ${b} = ?</b>`,vis:V.line(Math.min(a,0)-1,a+b+1,{jumps:[{from:a,to:a+b,t:'+'+b}],points:[{v:a,c:'#8b5cf6'}]}),type:'num',ans:a+b,hint:`Ponte en el ${a} y salta ${b} a la derecha.`,exp:`<b>${a+b}</b>.`}},
  ()=>{const t=R(-5,5),s=R(2,8);return{q:`Hace ${t} °C y la temperatura <b>sube</b> ${s} grados. ¿Cuántos grados hace?`,vis:V.thermo(t),type:'num',ans:t+s,hint:'Sube → sumo.',exp:`${t} + ${s} = <b>${t+s} °C</b>.`}}]},
{t:'Restar enteros con la recta',u:2,learn:{h:'<p>Restar un número es saltar a la <b>izquierda</b>.</p><p>3 − 5: me pongo en el 3 y salto 5 a la izquierda: llego a <b>−2</b>.</p>',v:()=>V.line(-3,4,{jumps:[{from:3,to:-2,t:'−5',c:'#dc2626'}],points:[{v:-2,t:'−2'}]}),x:'3 − 5 = −2'},
 steps:['<b>1 − 4</b>','Me pongo en el 1','Salto 4 a la izquierda: 0, −1, −2, −3','<b class="big">= −3</b>'],lab:['numline',{a:3,b:-5}],
 g:[()=>{const a=R(-3,6),b=R(1,7);return{q:`<b class="big">${a} − ${b} = ?</b>`,vis:V.line(a-b-1,Math.max(a,0)+1,{jumps:[{from:a,to:a-b,t:'−'+b,c:'#dc2626'}],points:[{v:a,c:'#8b5cf6'}]}),type:'num',ans:a-b,hint:`Ponte en el ${a} y salta ${b} a la izquierda.`,exp:`<b>${a-b}</b>.`}},
  ()=>{const p=R(1,4),b=R(p+1,p+3);return{q:`Estoy en la planta ${p} y bajo ${b} plantas. ¿En qué planta estoy?`,vis:'',type:'num',ans:p-b,hint:'Bajar → restar. Debajo de la planta 0 son negativos.',exp:`${p} − ${b} = <b>${p-b}</b>.`}}]},
// ---------- UD 3 ----------
{t:'Partes iguales',u:3,learn:{h:'<p>Una <b>fracción</b> sale de partir algo en <b>partes iguales</b>.</p><p>El número de <b>abajo</b> dice en cuántas partes lo partimos. El de <b>arriba</b>, cuántas cogemos.</p>',v:()=>V.pie(4,3,'#f97316'),x:'3 de 4 trozos = '+fr(3,4)},

{t:'Leer fracciones',u:3,learn:{h:'<p>'+fr(1,2)+' un medio · '+fr(1,3)+' un tercio · '+fr(1,4)+' un cuarto · '+fr(3,5)+' tres quintos.</p>',v:()=>V.pie(2,1)+V.pie(3,1,'#22c55e')+V.pie(4,1,'#3b82f6'),x:''},

  ()=>{const n=R(3,8),k=R(1,n-1);return{q:`Colorea ${fr(k,n)}.`,vis:'',type:'shade',n,shape:pick(['bar','pie']),ans:k,hint:`Hay ${n} trozos; pinta ${k}.`,exp:`${k} de ${n}.`}}]},

  ()=>{const b=pick([2,3,4]),k=R(1,b-1),m=R(2,3);return{q:`¿Son equivalentes ${fr(k,b)} y ${fr(k*m,b*m)}?`,vis:V.bar(b,k,'#ec4899')+V.bar(b*m,k*m,'#ec4899'),type:'mc',opts:['Sí','No'],fixed:true,ans:'Sí',hint:'¿Las barras pintan lo mismo?',exp:'<b>Sí</b>: pintan lo mismo.'}}]},
{t:'Comparar fracciones',u:3,learn:{h:'<p>Si tienen el <b>mismo denominador</b> (abajo), es mayor la que tiene <b>más trozos pintados</b> (arriba).</p>',v:()=>V.bar(5,3,'#f97316')+V.bar(5,1,'#f97316'),x:fr(3,5)+' &gt; '+fr(1,5)},
 steps:['Comparo '+fr(2,6)+' y '+fr(5,6),'Mismo denominador: 6','Arriba: 2 y 5','<b class="big">'+fr(2,6)+' &lt; '+fr(5,6)+'</b>'],
 g:[()=>{const d=R(4,8);let a=R(1,d-1),b=R(1,d-1);if(a===b)return null;const s=a>b?'>':'<';return{q:`Elige el signo: ${fr(a,d)} ☐ ${fr(b,d)}`,vis:V.bar(d,a,'#ec4899')+V.bar(d,b,'#06b6d4'),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'¿Qué barra tiene más pintado?',exp:`${a}/${d} ${s} ${b}/${d}`}},
  ()=>{const p=pick([[1,2,1,4],[1,2,1,3],[3,4,1,4],[2,3,1,3]]);const s=p[0]/p[1]>p[2]/p[3]?'>':'<';return{q:`Elige el signo: ${fr(p[0],p[1])} ☐ ${fr(p[2],p[3])}`,vis:V.pie(p[1],p[0])+V.pie(p[3],p[2],'#3b82f6'),type:'mc',opts:['>','<'],fixed:true,ans:s,hint:'¿Qué pizza tiene más pintado?',exp:`${p[0]}/${p[1]} ${s} ${p[2]}/${p[3]}`}}]},

  ()=>{const d=pick([3,4,5]),k=R(2,d-1),u=R(2,5);return{q:`¿Cuánto es ${fr(k,d)} de <b>${d*u}</b>?`,vis:V.groups(d,u,'apple'),type:'num',ans:k*u,hint:`Un grupo tiene ${d*u} : ${d}. Coge ${k} grupos.`,exp:`${d*u} : ${d} = ${u}; ${u} × ${k} = <b>${k*u}</b>.`}}]},

 steps:['<b>2,6 + 1,3</b>','Comas en columna','Décimas: 6 + 3 = 9 · Unidades: 2 + 1 = 3','<b class="big">3,9</b>'],

{t:'Lenguaje algebraico',u:6,learn:{h:'<p>Usamos la letra <b>x</b> para "un número".</p><p>"El doble" → <b>2x</b>. "Un número más 5" → <b>x + 5</b>. "La mitad" → <b>x : 2</b>.</p>',v:()=>V.machine('× 2','x'),x:'el doble de x = 2x'},
 steps:['"El triple de un número"','Triple = × 3','Un número = x','<b class="big">3x</b>'],lab:['linear'],
 g:[()=>{const E=[['El doble de un número','2x'],['Un número más 5','x + 5'],['El triple de un número','3x'],['Un número menos 2','x − 2']],e=pick(E);return{q:`¿Cómo se escribe <b>${e[0].toLowerCase()}</b>?`,vis:'',type:'mc',opts:mc(e[1],shuffle(E.map(x=>x[1]))),ans:e[1],hint:'Doble → 2x. Triple → 3x. Más → +. Menos → −.',exp:`<b>${e[1]}</b>.`}},
  ()=>{const m=R(2,3),x=R(1,9);return{q:`Si x = ${x}, ¿cuánto vale <b>${m}x</b>?`,vis:V.machine(`× ${m}`,x),type:'num',ans:m*x,hint:`${m} × ${x}`,exp:`<b>${m*x}</b>.`}}]},

{t:'Coordenadas',u:7,learn:{h:'<p>Un punto se escribe <b>(x, y)</b>: primero cuánto a la <b>derecha</b>, luego cuánto <b>arriba</b>.</p><p>Truco: primero por el pasillo, luego subo la escalera.</p>',v:()=>V.coords([[3,5,'A(3, 5)']]),x:''},
 steps:['Punto <b>(4, 2)</b>','Empiezo en el 0','Ando <b>4</b> a la derecha','Subo <b>2</b>: ahí está el punto'],lab:['coords'],
 g:[()=>{const x=R(1,7),y=R(1,7),o=[`(${x}, ${y})`,`(${y}, ${x})`,`(${x+1}, ${y})`,`(${x}, ${y+1})`];return{q:'¿Cuáles son las coordenadas del punto P?',vis:V.coords([[x,y,'P']]),type:'mc',opts:mc(o[0],o.slice(1)),ans:o[0],hint:'Primero la x (derecha), luego la y (arriba).',exp:`<b>${o[0]}</b>.`}},
  ()=>{const x=R(1,7),y=R(1,7);return{q:'¿A qué <b>altura</b> (y) está el punto?',vis:V.coords([[x,y,'Q']]),type:'num',ans:y,hint:'Mira a la izquierda, en el eje vertical.',exp:`y = <b>${y}</b>.`}}]},
{t:'Leer gráficas',u:7,learn:{h:'<p>Una <b>gráfica</b> muestra cómo cambia algo. Si la línea <b>sube</b>, aumenta. Si <b>baja</b>, disminuye.</p>',v:()=>V.lineGraph(['L','M','X','J','V'],[12,15,11,18,16]),x:'Temperaturas de la semana'},
 steps:['¿Qué temperatura hubo el jueves?','Busco la J abajo','Subo hasta el punto','Miro a la izquierda: <b class="big">18 °C</b>'],
 g:[()=>{const d=['L','M','X','J','V'],v=d.map(()=>R(5,25)),i=R(0,4),N=['lunes','martes','miércoles','jueves','viernes'];return{q:`¿Qué temperatura hubo el <b>${N[i]}</b>?`,vis:V.lineGraph(d,v),type:'num',ans:v[i],hint:'Sube desde el día hasta el punto y mira a la izquierda.',exp:`<b>${v[i]} °C</b>.`}},
  ()=>{const up=Math.random()<.5;return{q:'La gráfica…',vis:V.lineGraph(['1','2','3','4','5'],up?[2,5,8,11,14]:[14,11,8,5,2]),type:'mc',opts:['sube (crece)','baja (decrece)'],fixed:true,ans:up?'sube (crece)':'baja (decrece)',hint:'Mírala de izquierda a derecha.',exp:`<b>${up?'Sube':'Baja'}</b>.`}}]},
{t:'De la tabla a la gráfica',u:7,learn:{h:'<p>Cada columna de una tabla es un <b>punto</b>: (x, y).</p>',v:()=>V.table(['x','1','2','3'],[['y','2','4','6']])+V.coords([[1,2],[2,4],[3,6]]),x:'(1, 2), (2, 4), (3, 6)'},
 steps:['Tabla: x = 2, y = 4','Punto (2, 4)','2 a la derecha, 4 arriba','Lo dibujo en la cuadrícula'],lab:['linear'],
 g:[()=>{const k=R(1,3),x=R(1,4);return{q:`En la tabla, ¿cuánto vale <b>y</b> cuando x = ${x+1}?`,vis:V.table(['x','1','2','3','4','5'],[['y',...[1,2,3,4,5].map(v=>v===x+1?'?':String(k*v))]]),type:'num',ans:k*(x+1),hint:`Cada vez que x sube 1, y sube ${k}.`,exp:`<b>${k*(x+1)}</b>.`}}]},
// ---------- UD 8 ----------
{t:'Contar datos',u:8,learn:{h:'<p>Para contar datos hacemos <b>palotes</b>: de 4 en 4 y el quinto los tacha. Así contamos de <b>5 en 5</b>.</p>',v:()=>V.tally(12),x:'12'},
 steps:['Veo 2 grupos tachados y 3 palotes','Cada grupo tachado = 5','5 + 5 + 3','<b class="big">13</b>'],
 g:[()=>{const n=R(3,17);return{q:'¿Cuántos palotes hay?',vis:V.tally(n),type:'num',ans:n,hint:'Cada grupo tachado vale 5.',exp:`<b>${n}</b>.`}},
  ()=>{const d=Array.from({length:10},()=>R(1,3)),v=R(1,3),f=d.filter(x=>x===v).length;return{q:`Datos: ${d.join(', ')}. ¿Cuántas veces sale el <b>${v}</b>?`,vis:'',type:'num',ans:f,hint:`Cuenta los ${v}.`,exp:`<b>${f}</b>.`}}]},
{t:'Gráficos de barras',u:8,learn:{h:'<p>En un gráfico de barras, cuanto <b>más alta</b> la barra, <b>más</b> hay. El número está a la <b>izquierda</b>.</p>',v:()=>V.barChart(['Fútbol','Baloncesto','Pádel'],[8,5,3]),x:'A 8 alumnos les gusta el fútbol'},
 steps:['¿Cuántos eligen pádel?','Busco la barra de pádel','Miro su altura a la izquierda','<b class="big">3</b>'],
 g:[()=>{const L=['Fútbol','Balonc.','Pádel','Natac.'],v=L.map(()=>R(1,10)),i=R(0,3);return{q:`¿Cuántos alumnos eligen <b>${['fútbol','baloncesto','pádel','natación'][i]}</b>?`,vis:V.barChart(L,v),type:'num',ans:v[i],hint:'Sube hasta lo alto de la barra y mira a la izquierda.',exp:`<b>${v[i]}</b>.`}},
  ()=>{const L=['Rojo','Azul','Verde','Amarillo'],v=shuffle([2,5,7,9]),mx=L[v.indexOf(9)];return{q:'¿Qué color es el <b>más</b> elegido?',vis:V.barChart(L,v),type:'mc',opts:L,fixed:true,ans:mx,hint:'La barra más alta.',exp:`<b>${mx}</b>.`}}]},
{t:'La media',u:8,learn:{h:'<p>La <b>media</b> es "repartir a partes iguales": sumo todo y divido entre cuántos hay.</p><p>Notas 4, 6 y 8: (4 + 6 + 8) : 3 = 18 : 3 = <b>6</b>.</p>',v:()=>V.barChart(['Ana','Luis','Eva'],[4,6,8]),x:'Media = 6'},
 steps:['Datos: 2, 4, 6','Sumo: 2 + 4 + 6 = 12','Hay 3 datos: 12 : 3','<b class="big">Media = 4</b>'],
 g:[()=>{const m=R(3,8),d=[m-1,m,m+1];return{q:`Calcula la media de <b>${shuffle(d).join(', ')}</b>.`,vis:V.barChart(['1.º','2.º','3.º'],d),type:'num',ans:m,hint:'Suma y divide entre 3.',exp:`${3*m} : 3 = <b>${m}</b>.`}},
  ()=>{const m=R(3,8),d=[m-2,m+2];return{q:`Calcula la media de <b>${d.join(' y ')}</b>.`,vis:V.barChart(['A','B'],d),type:'num',ans:m,hint:'Suma y divide entre 2.',exp:`${2*m} : 2 = <b>${m}</b>.`}}]},
{t:'¿Seguro, posible o imposible?',u:8,learn:{h:'<p><b>Seguro</b>: pasa siempre. <b>Posible</b>: puede pasar. <b>Imposible</b>: no pasa nunca.</p>',v:()=>V.bag([['#ef4444',3],['#3b82f6',2]]),x:'Sacar verde de esta bolsa es imposible'},
 steps:['Bolsa: 3 rojas y 2 azules','¿Sacar roja?','Hay rojas, pero también azules','<b class="big">Posible</b>'],lab:['bag'],
 g:[()=>{const r=R(1,4),b=R(0,3),c=pick(['roja','azul','verde']);const k=c==='verde'||(c==='azul'&&b===0)?'Imposible':(c==='roja'&&b===0)?'Seguro':'Posible';return{q:`Saco una bola sin mirar. Sacar una bola <b>${c}</b> es…`,vis:V.bag([['#ef4444',r],['#3b82f6',b]]),type:'mc',opts:['Seguro','Posible','Imposible'],fixed:true,ans:k,hint:'Mira qué colores hay en la bolsa.',exp:`<b>${k}</b>.`}},
  ()=>{const w=pick([['un 6',1],['un número par',3],['un número menor que 3',2]]);return{q:`Lanzo un dado. ¿Cuántas caras dan <b>${w[0]}</b>?`,vis:[1,2,3,4,5,6].map(n=>V.dice(n)).join(''),type:'num',ans:w[1],hint:'Cuenta las caras que valen.',exp:`<b>${w[1]}</b> de 6.`}}]},
// ---------- Refuerzo ----------
{t:'Medir con la regla',u:9,learn:{h:'<p>Para medir, pon el <b>0</b> de la regla al principio del objeto y mira dónde <b>acaba</b>.</p><p>1 metro = 100 cm.</p>',v:()=>V.ruler(10,7),x:'El lápiz mide 7 cm'},
 steps:['Pongo el 0 al principio del lápiz','Miro dónde acaba la punta','En el número 9','<b class="big">9 cm</b>'],lab:['ruler'],
 g:[()=>{const l=R(2,11);return{q:'¿Cuántos centímetros mide el lápiz?',vis:V.ruler(12,l,pick(RC)),type:'num',ans:l,hint:'Mira el número donde acaba la punta.',exp:`<b>${l} cm</b>.`}},
  ()=>{const m=R(1,5);return{q:`¿Cuántos centímetros son <b>${m} m</b>?`,vis:'',type:'num',ans:100*m,hint:'1 m = 100 cm.',exp:`<b>${100*m} cm</b>.`}}]},
{t:'Perímetro',u:9,learn:{h:'<p>El <b>perímetro</b> es lo que mide el <b>borde</b>. Sumo <b>todos los lados</b>.</p>',v:()=>V.rect(5,3,'cm','#a78bfa'),x:'5 + 3 + 5 + 3 = 16 cm'},
 steps:['Rectángulo de 6 cm y 2 cm','Tiene 4 lados: 6, 2, 6, 2','Sumo: 6 + 2 + 6 + 2','<b class="big">16 cm</b>'],lab:['area'],
 g:[()=>{const w=R(2,8),h=R(1,5);return{q:'¿Cuál es el perímetro? (suma los 4 lados)',vis:V.rect(w,h,'cm','#fde68a'),type:'num',ans:2*(w+h),hint:`${w} + ${h} + ${w} + ${h}`,exp:`<b>${2*(w+h)} cm</b>.`}},
  ()=>{const s=R(2,9);return{q:`Un cuadrado tiene lados de ${s} cm. ¿Perímetro?`,vis:V.squares(Math.min(s,6),'#f472b6'),type:'num',ans:4*s,hint:'4 lados iguales.',exp:`4 × ${s} = <b>${4*s} cm</b>.`}}]},
{t:'Área contando cuadraditos',u:9,learn:{h:'<p>El <b>área</b> es lo que ocupa <b>por dentro</b>. Se cuenta en cuadraditos.</p><p>Truco: filas × columnas.</p>',v:()=>V.rect(4,3,'cm','#4ade80',true),x:'4 × 3 = 12 cuadraditos = 12 cm²'},
 steps:['Rectángulo de 5 × 2','2 filas de 5 cuadraditos','5 × 2','<b class="big">10 cm²</b>'],lab:['area'],
 g:[()=>{const w=R(2,7),h=R(2,5);return{q:'¿Cuántos cuadraditos tiene? (área)',vis:V.rect(w,h,'cm','#4ade80',true),type:'num',ans:w*h,hint:'Cuenta una fila y multiplica por las filas.',exp:`${w} × ${h} = <b>${w*h} cm²</b>.`}}]},
{t:'Ángulos',u:9,learn:{h:'<p>El ángulo <b>recto</b> es como la esquina de un folio (90°). Si es más cerrado, es <b>agudo</b>. Si es más abierto, <b>obtuso</b>.</p>',v:()=>V.angle(90)+V.angle(40)+V.angle(130),x:'Recto · agudo · obtuso'},
 steps:['Pongo la esquina de un folio sobre el ángulo','Si coincide: <b>recto</b>','Si es más cerrado: <b>agudo</b>','Si es más abierto: <b>obtuso</b>'],lab:['angle'],
 g:[()=>{const d=pick([30,45,60,90,90,120,135,150]),t=d<90?'Agudo':d===90?'Recto':'Obtuso';return{q:'¿Qué tipo de ángulo es?',vis:V.angle(d),type:'mc',opts:['Agudo','Recto','Obtuso'],fixed:true,ans:t,hint:'Compáralo con la esquina de un folio.',exp:`<b>${t}</b>.`}}]}
];
const UNITS_RUBEN=[[1,'UD 1 · Números naturales'],[2,'UD 2 · Números enteros'],[3,'UD 3 · Fracciones'],[4,'UD 4 · Decimales'],[5,'UD 5 · Proporcionalidad y porcentajes'],[6,'UD 6 · Álgebra'],[7,'UD 7 · Funciones'],[8,'UD 8 · Estadística'],[9,'Refuerzo · Medida y geometría']].map(([k,n])=>[n,SES_RUBEN.filter(s=>s.u===k).map(s=>s.t)]);
SES_RUBEN.forEach(s=>delete s.u);


// ===== Laboratorios manipulables (sustituyen a GeoGebra) y animaciones paso a paso =====
const LAB={};
const EN=()=>window.APP&&window.APP.lang==='en';
const tr=(es,en)=>EN()?en:es;
function sl(id,label,min,max,val,step=1){return `<label class="sl"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><b id="${id}v">${val}</b></label>`}
function bindSl(root,ids,draw){ids.forEach(i=>{const e=root.querySelector('#'+i);e.addEventListener('input',()=>{root.querySelector('#'+i+'v').textContent=e.value;draw()})});draw()}
const gv=(root,i)=>+root.querySelector('#'+i).value;

LAB.blocks=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('c',tr('Centenas','Hundreds'),0,p.maxC??4,1)}${sl('d',tr('Decenas','Tens'),0,9,2)}${sl('u',tr('Unidades','Ones'),0,9,3)}`;
 bindSl(root,['c','d','u'],()=>{const c=gv(root,'c'),d=gv(root,'d'),u=gv(root,'u');root.querySelector('#lv').innerHTML=V.blocks(c,d,u);root.querySelector('#lr').innerHTML=`<b class="c-c">${c*100}</b> + <b class="c-d">${d*10}</b> + <b class="c-u">${u}</b> = <b class="big">${c*100+d*10+u}</b>`})};
LAB.fraction=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('den',tr('Partes iguales (denominador)','Equal parts (denominator)'),1,12,4)}${sl('num',tr('Partes pintadas (numerador)','Shaded parts (numerator)'),0,12,3)}`;
 bindSl(root,['den','num'],()=>{const d=gv(root,'den'),ne=root.querySelector('#num');ne.max=d;if(+ne.value>d){ne.value=d;root.querySelector('#numv').textContent=d}const n=gv(root,'num');
  root.querySelector('#lv').innerHTML=V.pie(d,n,'#f97316')+V.bar(d,n,'#22c55e',300);const dec=n/d;root.querySelector('#lr').innerHTML=`${fr(n,d)} = <b>${EN()?fmtEN(+dec.toFixed(3)):fmt(+dec.toFixed(3))}</b> = <b>${EN()?fmtEN(+(dec*100).toFixed(1)):fmt(+(dec*100).toFixed(1))} %</b>`})};
LAB.percent=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('k',tr('Cuadraditos pintados','Shaded squares'),0,100,30)}`;
 bindSl(root,['k'],()=>{const k=gv(root,'k');root.querySelector('#lv').innerHTML=V.grid100(k,'#8b5cf6');root.querySelector('#lr').innerHTML=`<b class="big">${k} %</b> = ${fr(k,100)} = ${EN()?fmtEN(k/100):fmt(k/100)}`})};
LAB.numline=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('a',tr('Empiezo en','Start at'),-10,10,p.a??2)}${sl('b',tr('Salto (+ derecha, − izquierda)','Jump (+ right, − left)'),-10,10,p.b??-5)}`;
 bindSl(root,['a','b'],()=>{const a=gv(root,'a'),b=gv(root,'b'),c=a+b,lo=Math.min(a,c,0)-1,hi=Math.max(a,c,0)+1;root.querySelector('#lv').innerHTML=V.line(Math.max(lo,-20),Math.min(hi,20),{jumps:[{from:a,to:c,t:(b>0?'+':'')+b,c:b<0?'#dc2626':'#2563eb'}],points:[{v:a,c:'#8b5cf6'},{v:c,t:c,c:'#16a34a'}]}).replace('<path d="M','<path class="draw" d="M');
  root.querySelector('#lr').innerHTML=`${a} + ${sg(b)} = <b class="big">${c}</b>`})};
LAB.thermo=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('t',tr('Temperatura','Temperature'),-10,30,-3)}`;
 bindSl(root,['t'],()=>{const t=gv(root,'t');root.querySelector('#lv').innerHTML=V.thermo(t);root.querySelector('#lr').innerHTML=`<b class="big">${t} °C</b> · ${t<0?tr('bajo cero','below zero'):t===0?tr('cero','zero'):tr('sobre cero','above zero')}`})};
LAB.area=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('w',tr('Base','Length'),1,10,5)}${sl('h',tr('Altura','Width'),1,8,3)}`;
 bindSl(root,['w','h'],()=>{const w=gv(root,'w'),h=gv(root,'h');root.querySelector('#lv').innerHTML=V.rect(w,h,'cm','#a78bfa',true);root.querySelector('#lr').innerHTML=`${tr('Perímetro','Perimeter')} = ${w}+${h}+${w}+${h} = <b>${2*(w+h)} cm</b> · ${tr('Área','Area')} = ${w}·${h} = <b>${w*h} cm²</b>`})};
LAB.array=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('r',tr('Filas','Rows'),1,10,3)}${sl('c',tr('Columnas','Columns'),1,10,4)}`;
 bindSl(root,['r','c'],()=>{const r=gv(root,'r'),c=gv(root,'c');root.querySelector('#lv').innerHTML=V.array(r,c,'#ec4899');root.querySelector('#lr').innerHTML=`${r} × ${c} = <b class="big">${r*c}</b> · ${r*c} : ${r} = ${c}`})};
LAB.squares=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('n',tr('Lado','Side'),1,10,4)}`;
 bindSl(root,['n'],()=>{const n=gv(root,'n');root.querySelector('#lv').innerHTML=V.squares(n);root.querySelector('#lr').innerHTML=`${n}² = ${n}·${n} = <b class="big">${n*n}</b> · √${n*n} = ${n}`})};
LAB.cuboid=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('l',tr('Largo','Length'),1,5,3)}${sl('w',tr('Ancho','Width'),1,4,2)}${sl('h',tr('Alto','Height'),1,4,2)}`;
 bindSl(root,['l','w','h'],()=>{const l=gv(root,'l'),w=gv(root,'w'),h=gv(root,'h');root.querySelector('#lv').innerHTML=V.cuboid(l,w,h);root.querySelector('#lr').innerHTML=`${l} × ${w} × ${h} = <b class="big">${l*w*h}</b> ${tr('cubitos','cubes')}`})};
LAB.angle=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('g',tr('Grados','Degrees'),5,180,60,5)}`;
 bindSl(root,['g'],()=>{const g=gv(root,'g');root.querySelector('#lv').innerHTML=V.angle(g);root.querySelector('#lr').innerHTML=`<b class="big">${g}°</b> · ${g<90?tr('agudo','acute'):g===90?tr('recto','right'):g<180?tr('obtuso','obtuse'):tr('llano','straight')}`})};
LAB.clock=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('m',tr('Mueve las agujas','Move the hands'),0,715,180,5)}`;
 const W=['en punto','y cinco','y diez','y cuarto','y veinte','y veinticinco','y media','menos veinticinco','menos veinte','menos cuarto','menos diez','menos cinco'];
 bindSl(root,['m'],()=>{const t=gv(root,'m'),h=Math.floor(t/60)||12,m=t%60;root.querySelector('#lv').innerHTML=V.clock(h%12,m)+V.digital(h,m);const hh=m>30?(h%12)+1:h;root.querySelector('#lr').innerHTML=EN()?`<b class="big">${h}:${String(m).padStart(2,'0')}</b>`:`<b class="big">Las ${hh} ${W[m/5]}</b>`;root.querySelector('#mv').textContent=`${h}:${String(m).padStart(2,'0')}`})};
LAB.coords=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('x','x',0,8,3)}${sl('y','y',0,8,5)}`;
 bindSl(root,['x','y'],()=>{const x=gv(root,'x'),y=gv(root,'y');root.querySelector('#lv').innerHTML=V.coords([[x,y,`P(${x}, ${y})`,'#ef4444']]);root.querySelector('#lr').innerHTML=`P = <b class="big">(${x}, ${y})</b>`})};
LAB.linear=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('a',tr('Pendiente a','Slope a'),-3,3,2,.5)}${sl('b',tr('Ordenada b','Intercept b'),-4,4,0)}`;
 bindSl(root,['a','b'],()=>{const a=gv(root,'a'),b=gv(root,'b'),u=24,O=150,X=v=>O+v*u,Y=v=>O-v*u;let s='';for(let i=-6;i<=6;i++)s+=`<line x1="${X(i)}" y1="6" x2="${X(i)}" y2="294" stroke="#e2e8f0"/><line x1="6" y1="${Y(i)}" x2="294" y2="${Y(i)}" stroke="#e2e8f0"/>`;
  s+=`<line x1="6" y1="${O}" x2="294" y2="${O}" stroke="#0f172a" stroke-width="2"/><line x1="${O}" y1="6" x2="${O}" y2="294" stroke="#0f172a" stroke-width="2"/>`;s+=`<line class="draw" x1="${X(-6)}" y1="${Y(a*-6+b)}" x2="${X(6)}" y2="${Y(a*6+b)}" stroke="#e11d48" stroke-width="4"/>`;

  else{Q.locked=true;q.res='no';d.a++;d.s+=secs;Q.wrong.push(strip(q.q)+' → '+(Array.isArray(q.ans)?q.ans.join(', '):String(q.ans)));if(btn)btn.classList.add('bad');else if($('#disp'))$('#disp').classList.add('bad');
    app.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===String(q.ans))b.classList.add('good')});
    fb('no',`${L.sol} <b>${Array.isArray(q.ans)?q.ans.map(x=>showFr(String(x))).join(q.desc?' &gt; ':' &lt; '):showFr(String(q.ans))}</b>. ${q.exp}<br><span class="small">${L.noWorry}</span>`);end()}
  Q.usedHint=Q.usedHint&&!Q.locked?Q.usedHint:Q.usedHint;save();
  function end(){Q.usedHint=false;$('#chk').hidden=true;$('#hint').hidden=true;$('#nx').hidden=false;$('#nx').focus()}}
function next(){Q.k++;if(Q.k<Q.qs.length)ask();else finish()}
function record(partial){const i=Q.i,n=partial?Q.k:Q.qs.length;if(!n)return null;const p=Math.round(Q.score/n*100),st=partial?0:(p>=90?3:p>=70?2:p>=40?1:0);
  if(!partial){store.best[S[i].t]=Math.max(store.best[S[i].t]||0,st);store.pct[S[i].t]=Math.max(store.pct[S[i].t]||0,p)}
  const r={t:S[i].t,u:S[i].u,d:new Date(Q.t0).toISOString(),dur:Math.round((Date.now()-Q.t0)/1000),n,sc:+Q.score.toFixed(2),p,ok1:Q.ok1,h:Q.hints,w:Q.wrong,partial:!!partial};
  store.log.unshift(r);store.log=store.log.slice(0,400);save();return{r,st}}
function savePartial(){if(Q&&Q.k>0&&Q.k<Q.qs.length&&!Q.saved){Q.saved=true;record(true)}Q=null}
function finish(){const i=Q.i,{r,st}=record(false);Q.saved=true;
  app.innerHTML=`<div class="top band"><span class="cnt">${L.session} ${i+1}</span><span style="flex:1"></span>${endBtn()}</div><section class="band endb"><div class="card end" style="--c:${PAL[i%8]}"><p class="tag">${esc(S[i].t)}</p><h2>${st>=2?L.great:st===1?L.good:L.keep}</h2>
   <div class="bigstars">${stars(st)}</div><p class="sc">${String(r.sc).replace('.',A.dec)} / ${r.n} ${L.points} · <b>${r.p} %</b></p>
   <div class="stats in"><div class="kpi"><b>${r.ok1}/${r.n}</b><span>${L.kFirst}</span></div><div class="kpi"><b>${r.h}</b><span>${L.kHints}</span></div><div class="kpi"><b>${fmtT(r.dur)}</b><span>${L.kTime}</span></div><div class="kpi"><b>${store.att[r.t]||1}</b><span>${L.kTries}</span></div></div>
   ${r.w.length?`<details class="wl"><summary>${L.review} (${r.w.length})</summary><ul>${r.w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`:''}
   <div class="row"><button class="ghost big" id="rep">${L.repeat}</button>${i<S.length-1?`<button class="ghost big" id="nxs">${L.nextS}</button>`:''}<button class="cta big" id="hm">${L.menu}</button></div></div></section>`;
  Q=null;if(st>=2)confetti(60);$('#rep').onclick=()=>quiz(i);$('#hm').onclick=home;const n=$('#nxs');if(n)n.onclick=()=>learn(i+1);bindEnd()}
function confetti(n=24){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='conf';for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=PAL[i%8];p.style.animationDelay=Math.random()*.3+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}
function shadeSvg(n,shape){if(shape==='pie'){const cx=110,cy=110,r=100;let b='';for(let i=0;i<n;i++){const a1=2*Math.PI*i/n-Math.PI/2,a2=2*Math.PI*(i+1)/n-Math.PI/2;b+=`<path class="pc" data-i="${i}" d="M${cx} ${cy}L${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)}A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a2)).toFixed(2)} ${(cy+r*Math.sin(a2)).toFixed(2)}Z"/>`}return `<svg class="vis tap sq" viewBox="0 0 220 220">${b}</svg>`}
  if(shape==='grid'){const c=n%5===0&&n>5?5:n%4===0&&n>4?4:n%3===0&&n>3?3:n,r=n/c;let b='';for(let i=0;i<n;i++)b+=`<rect class="pc" data-i="${i}" x="${6+(i%c)*64}" y="${6+Math.floor(i/c)*64}" width="64" height="64"/>`;return `<svg class="vis tap" viewBox="0 0 ${c*64+12} ${r*64+12}">${b}</svg>`}
  const w=Math.min(90,560/n);let b='';for(let i=0;i<n;i++)b+=`<rect class="pc" data-i="${i}" x="${6+i*w}" y="6" width="${w}" height="90"/>`;return `<svg class="vis tap" viewBox="0 0 ${n*w+12} 102">${b}</svg>`}

// ---------- Terminar: resumen + envío al profesor ----------
function buildReport(){const since=store.lastEnd?new Date(store.lastEnd):new Date(0),now=new Date();
  const L2=store.log.filter(r=>new Date(r.d)>since),n=L2.reduce((a,r)=>a+r.n,0),ok1=L2.reduce((a,r)=>a+r.ok1,0),h=L2.reduce((a,r)=>a+r.h,0),dur=L2.reduce((a,r)=>a+r.dur,0);
  const done=S.filter(s=>store.pct[s.t]!=null).length,stars=S.reduce((a,s)=>a+(store.best[s.t]||0),0);
  const units=[...new Set(S.map(s=>s.u))].map(u=>{const x=unitStats(u);return{u,done:x.done,n:x.n,av:x.av}});
  const fails=L2.flatMap(r=>r.w.map(w=>`[${r.t}] ${w}`));
  const fecha=now.toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'});
  const txt=[`INFORME · ${WHO}${WHO!==A.name?` (usando la app de ${A.name})`:''} · ${fecha}`,'',
   `Trabajo de esta vez: ${L2.length} sesión(es), ${n} preguntas, ${pc(ok1,n)} % acertadas a la primera, ${h} pistas pedidas, ${mins(dur)} min.`,
   ...L2.slice().reverse().map(r=>`  · ${r.t}${r.partial?' (sin terminar)':''}: ${String(r.sc).replace('.',',')}/${r.n} (${r.p} %), ${r.ok1} a la primera, ${r.h} pistas, ${fmtT(r.dur)}`),'',
   `Progreso del curso: ${done}/${S.length} sesiones superadas (${pc(done,S.length)} %), ${stars} estrellas de ${S.length*3}.`,
   ...units.map(x=>`  · ${x.u}: ${x.done}/${x.n}${x.done?` · media ${x.av} %`:''}`),'',
   fails.length?'Fallos (pregunta → solución):':'Sin fallos en esta tanda.',...fails.slice(0,40).map(f=>'  · '+f)].join('\n');
  return{txt,data:{alumno:WHO,app:A.key,fecha:now.toISOString(),desde:store.lastEnd,sesiones:L2,curso:{hechas:done,total:S.length,estrellas:stars,unidades:units}},n,ok1,h,dur,ses:L2.length}}
async function terminate(){if(Q&&!Q.saved){savePartial()}
  const rep=buildReport();store.outbox.push({txt:rep.txt,data:rep.data});store.lastEnd=new Date().toISOString();save();
  app.innerHTML=`<section class="band endb"><div class="card end" style="--c:var(--cta)"><p class="tag">${L.finishBtn}</p><h2>${rep.ses?L.byeGood:L.byeEmpty}</h2>
   <div class="stats in"><div class="kpi"><b>${rep.ses}</b><span>${L.kSessions}</span></div><div class="kpi"><b>${rep.n}</b><span>${L.kAnswers}</span></div><div class="kpi"><b>${pc(rep.ok1,rep.n)} %</b><span>${L.kFirst}</span></div><div class="kpi"><b>${mins(rep.dur)} min</b><span>${L.kTime}</span></div></div>
   <p class="sendst" id="sst">${L.sending}</p>
   <div class="row c"><button class="ghost big" id="shr">${L.shareBtn}</button><button class="ghost big" id="oth">${L.changeWho}</button><button class="cta big" id="hm">${L.menu}</button></div></div></section>`;
  $('#oth').onclick=whoScreen;
  if(rep.ses)confetti(50);$('#hm').onclick=home;
  $('#shr').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'Informe '+WHO,text:rep.txt});return}}catch(e){}try{await navigator.clipboard.writeText(rep.txt);$('#sst').textContent=L.copied}catch(e){}};
  const n=await flush();const el=$('#sst');if(el)el.innerHTML=store.outbox.length?`<span class="warn">${L.notSent}</span>`:`<span class="okk">✔ ${L.sent}</span>`;scormEnd()}

// ---------- Panel del profesor ----------
function teacher(){const d=document.createElement('div');d.className='modal';
  const all=store.log,n=all.reduce((a,r)=>a+r.n,0),ok1=all.reduce((a,r)=>a+r.ok1,0),h=all.reduce((a,r)=>a+r.h,0),dur=all.reduce((a,r)=>a+r.dur,0),done=S.filter(s=>store.pct[s.t]!=null).length;
  const days=[];for(let i=13;i>=0;i--){const k=new Date(Date.now()-i*864e5),key=k.getFullYear()+'-'+String(k.getMonth()+1).padStart(2,'0')+'-'+String(k.getDate()).padStart(2,'0');days.push([k.toLocaleDateString('es-ES',{day:'numeric',month:'numeric'}),store.days[key]||{s:0,a:0,c:0}])}
  const mx=Math.max(1,...days.map(x=>x[1].s));
  const units=[...new Set(S.map(s=>s.u))].map(u=>[u,unitStats(u)]);
  const failC={};all.forEach(r=>r.w.forEach(()=>{failC[r.t]=(failC[r.t]||0)+1}));const topF=Object.entries(failC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  d.innerHTML=`<div class="mbox"><div class="row sb"><h2>Panel del profesor · ${esc(WHO)}${WHO!==A.name?` <span class="small">(app ${esc(A.name)})</span>`:''}</h2><button class="cta" id="cl">Cerrar</button></div>
   <div class="stats in"><div class="kpi"><b>${pc(done,S.length)} %</b><span>curso (${done}/${S.length})</span></div><div class="kpi"><b>${mins(dur)} min</b><span>tiempo total</span></div><div class="kpi"><b>${n}</b><span>preguntas</span></div><div class="kpi"><b>${pc(ok1,n)} %</b><span>a la primera</span></div><div class="kpi"><b>${h}</b><span>pistas pedidas</span></div><div class="kpi"><b>${store.sent}</b><span>informes enviados${store.outbox.length?` · ${store.outbox.length} pendientes`:''}</span></div></div>
   <h3>Minutos por día (últimas 2 semanas)</h3><div class="days">${days.map(([l,x])=>`<div><i style="height:${Math.round(x.s/mx*100)}%" title="${mins(x.s)} min · ${x.a} preguntas"></i><span>${l}</span></div>`).join('')}</div>
   <h3>Progreso por unidad</h3><table class="ut"><tr><th>Unidad</th><th>Sesiones</th><th>Estrellas</th><th>Media</th><th></th></tr>${units.map(([u,x])=>`<tr><td>${esc(u)}</td><td class="r">${x.done}/${x.n}</td><td class="r">${x.st}</td><td class="r">${x.done?x.av+' %':'—'}</td><td style="width:30%"><i class="bar"><i style="width:${pc(x.done,x.n)}%"></i></i></td></tr>`).join('')}</table>
   ${topF.length?`<h3>Donde más falla</h3><ul class="tf">${topF.map(([t,c])=>`<li><b>${esc(t)}</b>: ${c} fallos</li>`).join('')}</ul>`:''}
   <h3>Registro</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Nota</th><th>1.ª</th><th>Pistas</th><th>Tiempo</th><th>Fallos</th></tr></thead><tbody>${all.map(r=>{const dt=new Date(r.d);return `<tr><td>${dt.toLocaleDateString('es-ES')} ${dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.t)}${r.partial?' <i>(a medias)</i>':''}</td><td class="r">${r.p} %</td><td class="r">${r.ok1}/${r.n}</td><td class="r">${r.h}</td><td class="r">${fmtT(r.dur)}</td><td class="w">${r.w.map(esc).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan="7">Todavía no hay sesiones hechas.</td></tr>'}</tbody></table></div>
   <div class="row"><button class="ghost" id="snd">Enviar informe ahora</button><button class="ghost" id="cp">Copiar informe completo</button><button class="ghost" id="rs">Borrar datos</button></div><p class="small" id="msg"></p></div>`;
  document.body.appendChild(d);
  d.querySelector('#cl').onclick=()=>{d.remove();home()};
  d.querySelector('#snd').onclick=async()=>{const rep=buildReport();store.outbox.push({txt:rep.txt,data:rep.data});store.lastEnd=new Date().toISOString();save();await flush();d.querySelector('#msg').textContent=store.outbox.length?'No hay conexión: se enviará más tarde.':'Informe enviado al formulario.'};
  d.querySelector('#cp').onclick=()=>{const t='Informe '+WHO+'\n'+all.map(r=>`${new Date(r.d).toLocaleString('es-ES')} | ${r.t} | ${r.p} % | 1.ª ${r.ok1}/${r.n} | pistas ${r.h} | ${fmtT(r.dur)}${r.w.length?' | Fallos: '+r.w.join('; '):''}`).join('\n');
    try{navigator.clipboard.writeText(t).then(()=>d.querySelector('#msg').textContent='Copiado.',()=>d.querySelector('#msg').textContent='No se ha podido copiar.')}catch(e){}};
  let arm=false;d.querySelector('#rs').onclick=e=>{if(!arm){arm=true;e.target.textContent='Pulsa otra vez para borrar todo';return}store=blank();save();d.remove();home()}}
// ---------- ¿Quién eres? ----------
function whoScreen(){if(Q&&!Q.saved)savePartial();const ps=profiles();
  app.innerHTML=`<section class="band endb"><div class="card end who" style="--c:var(--cta)"><p class="tag">${esc(A.sub)}</p><h2>${L.whoQ}</h2>
   <button class="cta big mainwho" id="me">${esc(A.name)}</button>
   ${ps.length?`<p class="small">${L.whoUsed}</p><div class="whol">${ps.map(p=>`<button class="ghost" data-p="${esc(p)}">${esc(p)}</button>`).join('')}</div>`:''}
   <form id="wf" class="wf"><label for="wn">${L.whoOther}</label><input id="wn" autocomplete="off" autocapitalize="words" maxlength="40" placeholder="${L.whoPh}"><button class="ghost big" type="submit">${L.whoGo}</button></form>
   <p class="small warn" id="wm"></p></div></section>`;
  $('#me').onclick=()=>{login(A.name);home()};
  app.querySelectorAll('.whol button').forEach(b=>b.onclick=()=>{login(b.dataset.p);home()});
  $('#wf').addEventListener('submit',e=>{e.preventDefault();let n=$('#wn').value.trim().replace(/\s+/g,' ');if(n.length<3){$('#wm').textContent=L.whoShort;return}
    n=n.split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1):w).join(' ');if(n.toLowerCase()===A.name.toLowerCase())n=A.name;login(n);home()});window.scrollTo(0,0)}
{const w=ls.get(BASE+'-who');if(w){login(w);home()}else whoScreen()}
}

</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body></html>
