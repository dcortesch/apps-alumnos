<title>Rubén López</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cuaderno de juego para un alumno concreto, cálido y claro
   IDEA: el mapa de progreso de un videojuego: cada sesión es una parada del camino
   PICTURE: escena propia del alumno (carretera Moto-Mates, arcoíris, ruta de montaña) que avanza con su progreso
   COLOUR and TYPE: color dominante del alumno en la banda, acento fuerte en los botones; tipografía redonda y grande
   LAYOUT: banda superior con nombre y escena; rejilla de sesiones; práctica a una columna con teclado táctil */
:root{color-scheme:light dark;--bg:light-dark(#eaf3fb,#10151f);--ink:light-dark(#14213d,#eef2ff);--card:light-dark(#ffffff,#1a2233);--line:light-dark(#d9e1ee,#2c3850);--band:#0f3d5e;--bandink:#ffffff;--cta:#ff7a00;--ctaink:#fff;--soft:light-dark(#e7eef8,#222c42)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Baloo 2",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--cta);outline-offset:3px}
.band{padding:clamp(18px,3vw,40px) max(4vw,16px)}
.hero{background:var(--band);color:var(--bandink);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,64px);line-height:1.02;margin:.1em 0 .15em;text-wrap:balance}
.kick{margin:0;font-weight:700;opacity:.85}.lead{margin:0 0 10px;font-size:19px;opacity:.95}
.tot{margin:0;display:flex;align-items:center;gap:6px;font-size:18px}.tot .st{width:26px;height:26px}
.hero-v svg{width:100%;height:auto;display:block}
h2{font-size:26px;line-height:1.15;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ses{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;gap:4px 12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;min-height:96px;box-shadow:0 3px 0 var(--line)}
.ses:active{transform:translateY(2px);box-shadow:none}
.ses .n{grid-row:span 2;width:52px;height:52px;border-radius:16px;background:var(--c);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.ses .tt{font-weight:700;font-size:18px;line-height:1.2}.ses .tt i{display:block;font-weight:500;font-size:14px;opacity:.7}
.st{width:22px;height:22px;fill:light-dark(#dfe5ef,#3a4560)}.st.on{fill:#f59e0b}
.foot{display:flex;justify-content:flex-end}
.top{display:flex;align-items:center;gap:14px;padding-block:14px;background:var(--band);color:var(--bandink);position:sticky;top:0;z-index:5}
.top h2{margin:0;font-size:22px}
.icon{width:52px;height:52px;border-radius:16px;border:0;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.qh .icon{background:var(--soft);color:var(--ink)}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}.dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.cur{background:#fff}.dot.ok{background:#22c55e}.dot.half{background:#f59e0b}.dot.no{background:#ef4444}
.cnt{font-weight:800;font-size:18px}
.card{background:var(--card);border-radius:28px;padding:clamp(18px,3vw,34px);border:3px solid var(--c);max-width:980px;margin:0 auto;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.tag{display:inline-block;margin:0 0 10px;background:var(--c);color:#fff;font-weight:800;padding:4px 14px;border-radius:99px;font-size:15px}
.lt{font-size:22px;line-height:1.45}.lt p{margin:.3em 0}
.ex{font-size:20px;font-weight:700;text-align:center;margin:8px 0 0}
.es{background:var(--soft);border-radius:14px;padding:10px 14px;font-size:17px;font-style:italic;margin:10px 0}
.estog{border:2px solid var(--line);background:transparent;border-radius:99px;padding:6px 16px;font-size:15px;font-weight:700;margin-top:6px}.estog.on{background:var(--c);color:#fff;border-color:var(--c)}
.gl{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}.gl .tag{width:100%;max-width:max-content}.gl span{background:var(--soft);border-radius:12px;padding:6px 12px;font-size:16px}
.visbox{background:#fff;color:#0f172a;border-radius:20px;padding:14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;border:2px solid light-dark(#eef2f7,#000)}
.visbox:empty{display:none}
.vis{max-width:100%;height:auto;max-height:260px;width:auto}.vis.sq{width:min(220px,40vw)}.vis.tall{height:240px}
.qh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.qt{font-size:clamp(22px,2.8vw,28px);font-weight:600;line-height:1.35;margin:0}
.big{font-size:1.25em}
.qt .big{font-size:1.3em;font-weight:800;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-weight:800}.fr span+span{border-top:3px solid currentColor;padding-top:1px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}.opts.o3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:74px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-size:24px;font-weight:800;padding:10px;box-shadow:0 4px 0 var(--line)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.good,.disp.good{border-color:#16a34a;background:#dcfce7;color:#14532d}.opt.bad,.disp.bad{border-color:#dc2626;background:#fee2e2;color:#7f1d1d}.opt:disabled{opacity:.6}
.disp{min-height:72px;border:3px solid var(--line);border-radius:18px;font-size:40px;font-weight:800;text-align:center;padding:6px;margin:6px auto 12px;max-width:420px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:460px;margin:0 auto}
.key{min-height:66px;border-radius:18px;border:0;background:var(--soft);font-size:30px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:none}.key.del{background:light-dark(#ffe4e6,#3b1d27)}
.fb{border-radius:18px;padding:14px 18px;font-size:20px;margin-top:14px;line-height:1.45}
.fb.ok{background:#dcfce7;color:#14532d}.fb.try,.fb.hint{background:#fef3c7;color:#713f12}.fb.no{background:#fee2e2;color:#7f1d1d}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:18px}
.cta,.ghost{min-height:56px;border-radius:18px;padding:10px 22px;font-weight:800;display:inline-flex;align-items:center;gap:8px;border:0}
.cta{background:var(--cta);color:var(--ctaink);box-shadow:0 4px 0 color-mix(in srgb,var(--cta) 60%,#000)}
.ghost{background:var(--soft);color:var(--ink)}
.cta:active,.ghost:active{transform:translateY(3px);box-shadow:none}
.endb{min-height:70vh;display:grid;place-items:center}.end{text-align:center}.end h2{font-size:clamp(36px,5vw,52px)}
.bigstars .st{width:min(90px,22vw);height:min(90px,22vw)}.sc{font-size:24px;font-weight:700}.end .row{justify-content:center}
.c-u{color:#ea580c}.c-d{color:#16a34a}.c-c{color:#2563eb}.c-r{color:#dc2626}.c-b{color:#2563eb}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:22px;padding:22px;max-width:980px;width:100%;max-height:90vh;overflow:auto}
.small{font-size:14px;opacity:.8}.sum{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.sum span{display:inline-flex;align-items:center;gap:2px;font-weight:700;background:var(--soft);border-radius:10px;padding:4px 8px}.sum .st{width:16px;height:16px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}td.r{text-align:right;white-space:nowrap}td.w{font-size:13px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.conf i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{top:105%;transform:rotate(540deg)}}
html,body{overscroll-behavior:none}
button,.ses,.key,.opt,.sl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:var(--cta);margin-top:-14px;border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@media (min-width:1000px) and (orientation:landscape){.qbody.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:center}.qbody.two .visbox{margin:6px 0}.card{max-width:1120px}}
@media (orientation:portrait) and (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (display-mode:standalone){.top{padding-top:calc(14px + env(safe-area-inset-top))}}
.unit{font-size:22px;margin:26px 0 12px;padding-left:12px;border-left:6px solid var(--cta)}
.ses.rev{background:var(--soft)}
.labbox .ghost{background:var(--card);border:2px solid var(--line)}
.labbox{background:var(--soft);border-radius:22px;padding:16px;margin-top:16px}
.labv{background:#fff;color:#0f172a;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:120px}
.labr{text-align:center;font-size:22px;margin:10px 0}
.sl{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) 56px;gap:10px;align-items:center;margin:8px 0;font-weight:700;font-size:16px}
.sl b{text-align:center;font-size:20px;background:var(--card);border-radius:10px;padding:4px}
input[type=range]{width:100%;height:44px;accent-color:var(--cta)}
.steps{display:grid;gap:8px;min-height:60px}.step{font-size:24px;text-align:center;padding:10px;border-radius:14px;background:var(--card)}
.step.old{opacity:.55;font-size:20px}.step.new{animation:pop .6s cubic-bezier(.2,.9,.3,1.3);border:3px solid var(--cta)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 1s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.glt{width:100%;border-collapse:collapse;font-size:17px}.glt th{background:var(--c);color:#fff;text-align:left;padding:6px 10px}.glt td{padding:6px 10px;border-bottom:1px solid var(--line)}
.vt{border-collapse:collapse;font-size:18px;background:#fff;color:#0f172a}.vt th,.vt td{border:2px solid #94a3b8;padding:6px 14px;text-align:center}.vt th{background:#e0e7ff}
.inst{text-align:center;font-weight:700;font-size:19px;margin:6px 0}
.tapbox{padding:18px}.vis.tap{max-height:300px;width:min(560px,100%)}.vis.tap.sq{width:min(300px,70vw)}
.pc{fill:#fff;stroke:#334155;stroke-width:3;cursor:pointer;transition:fill .15s}.pc.on{fill:var(--cta)}
.tray{min-height:64px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px;font-size:26px;font-weight:800;margin-bottom:12px}
.tray span{background:var(--soft);border-radius:12px;padding:4px 12px}.tray i{font-style:normal;color:var(--cta)}
.ords{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.row.c{justify-content:center}
@media(max-width:700px){.hero{grid-template-columns:1fr}.opts.o3{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div>
<script>
// ===== Utilidades y dibujos SVG comunes (sin DOM) =====
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const fmt=(x,dec)=>{let s=(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));return s.replace('.',',')};
const fmtEN=(x,dec)=>(dec!=null?(+x).toFixed(dec):String(+(+x).toFixed(6)));
const miles=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const thou=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const sg=n=>n<0?`(${n})`:`${n}`; // entero con paréntesis si negativo
// opciones de elección múltiple únicas a partir de la correcta y distractores
function mc(ans,dis,n=4){const s=[String(ans)];for(const d of dis){const v=String(d);if(!s.includes(v)&&s.length<n)s.push(v)}return shuffle(s)}
function near(ans,spread=3,n=4,allowNeg=false){const d=[];let g=0;while(d.length<n*3&&g++<200){const v=ans+R(-spread,spread);if(v!==ans&&(allowNeg||v>=0))d.push(v)}return d}

const PAL=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];
const svg=(w,h,body,cls='')=>`<svg class="vis ${cls}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${body}</svg>`;
const T=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||16}" font-weight="${o.w||700}" fill="${o.c||'currentColor'}" text-anchor="${o.a||'middle'}" dominant-baseline="middle" font-family="inherit">${t}</text>`;

const V={
  // bloques multibase: centenas, decenas, unidades
  blocks(c,d,u){const s=7,P=[];let x=10;
    for(let i=0;i<c;i++){let g=`<rect x="${x}" y="10" width="${s*10}" height="${s*10}" rx="2" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x+k*s} 10v${s*10}M${x} ${10+k*s}h${s*10}" stroke="#1e3a8a" stroke-opacity=".45"/>`;P.push(g);x+=s*10+12}
    for(let i=0;i<d;i++){let g=`<rect x="${x}" y="10" width="${s}" height="${s*10}" rx="2" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>`;
      for(let k=1;k<10;k++)g+=`<path d="M${x} ${10+k*s}h${s}" stroke="#14532d" stroke-opacity=".5"/>`;P.push(g);x+=s+7}
    if(d)x+=6;
    for(let i=0;i<u;i++){P.push(`<rect x="${x}" y="${10+s*9}" width="${s}" height="${s}" rx="1.5" fill="#f97316" stroke="#7c2d12" stroke-width="1.2"/>`);x+=s+5}
    return svg(Math.max(x+10,120),s*10+22,P.join(''))},
  // objetos sencillos para contar
  icon(kind,x,y,r=12,c){const col=c||({apple:'#ef4444',star:'#eab308',ball:'#3b82f6',fish:'#06b6d4',flower:'#ec4899',cookie:'#b45309'})[kind]||'#8b5cf6';
    if(kind==='star'){let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=(i?'L':'M')+(x+rr*Math.cos(a)).toFixed(1)+' '+(y+rr*Math.sin(a)).toFixed(1)}return `<path d="${p}Z" fill="${col}" stroke="#854d0e" stroke-width="1"/>`}
    if(kind==='apple')return `<circle cx="${x}" cy="${y+1}" r="${r*.9}" fill="${col}"/><path d="M${x} ${y-r*.8}q2 -6 7 -7" stroke="#166534" stroke-width="2.5" fill="none"/><circle cx="${x-r*.35}" cy="${y-r*.2}" r="${r*.2}" fill="#fff" opacity=".5"/>`;
    if(kind==='fish')return `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.6}" fill="${col}"/><path d="M${x+r*.8} ${y}l${r*.7} -${r*.55}v${r*1.1}z" fill="${col}"/><circle cx="${x-r*.45}" cy="${y-r*.1}" r="2" fill="#0f172a"/>`;
    if(kind==='flower'){let g='';for(let i=0;i<5;i++){const a=Math.PI*2/5*i;g+=`<circle cx="${x+r*.55*Math.cos(a)}" cy="${y+r*.55*Math.sin(a)}" r="${r*.45}" fill="${col}"/>`}return g+`<circle cx="${x}" cy="${y}" r="${r*.35}" fill="#facc15"/>`}
    if(kind==='cookie')return `<circle cx="${x}" cy="${y}" r="${r}" fill="#d97706" stroke="#92400e" stroke-width="1.5"/><circle cx="${x-4}" cy="${y-3}" r="2" fill="#451a03"/><circle cx="${x+4}" cy="${y+2}" r="2" fill="#451a03"/><circle cx="${x-1}" cy="${y+5}" r="1.6" fill="#451a03"/>`;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/><path d="M${x-r} ${y}h${2*r}M${x} ${y-r}q${r*.7} ${r} 0 ${2*r}" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/>`},
  objects(n,kind='apple',perRow=10){const r=13,gap=34,rows=Math.ceil(n/perRow),w=Math.min(n,perRow)*gap+16;let b='';
    for(let i=0;i<n;i++){const cx=24+(i%perRow)*gap,cy=24+Math.floor(i/perRow)*gap;b+=V.icon(kind,cx,cy,r)}return svg(Math.max(w,80),rows*gap+14,b)},
  // grupos en platos (multiplicación)
  groups(g,k,kind='cookie'){const pw=Math.max(90,Math.ceil(Math.sqrt(k))*30+20),W=g*(pw+12)+12;let b='';
    for(let i=0;i<g;i++){const x0=12+i*(pw+12);b+=`<ellipse cx="${x0+pw/2}" cy="60" rx="${pw/2}" ry="48" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`;
      const c=Math.ceil(Math.sqrt(k));for(let j=0;j<k;j++){const rr=Math.floor(j/c),cc=j%c,rowsN=Math.ceil(k/c);b+=V.icon(kind,x0+pw/2+(cc-(c-1)/2)*26,60+(rr-(rowsN-1)/2)*26,10)}}
    return svg(W,122,b)},
  // reparto: total objetos y k platos vacíos
  share(total,k,kind='cookie'){const W=Math.max(total*26+20,k*96+20);let b='';
    for(let i=0;i<total;i++)b+=V.icon(kind,20+i*26,22,10);
    for(let i=0;i<k;i++){const cx=60+i*96;b+=`<ellipse cx="${cx}" cy="86" rx="42" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`+T(cx,124,'plato '+(i+1),{s:12,w:600,c:'#92400e'})}
    return svg(W,136,b)},
  array(r,c,col='#8b5cf6'){let b='';for(let i=0;i<r;i++)for(let j=0;j<c;j++)b+=`<circle cx="${22+j*28}" cy="${22+i*28}" r="10" fill="${col}"/>`;return svg(c*28+16,r*28+16,b)},
  clock(h,m){const cx=100,cy=100;let b=`<circle cx="${cx}" cy="${cy}" r="92" fill="#fff" stroke="#3b82f6" stroke-width="8"/>`;
    for(let i=0;i<60;i++){const a=Math.PI/30*i,l=i%5?5:11;b+=`<line x1="${cx+80*Math.sin(a)}" y1="${cy-80*Math.cos(a)}" x2="${cx+(80-l)*Math.sin(a)}" y2="${cy-(80-l)*Math.cos(a)}" stroke="#334155" stroke-width="${i%5?1.5:3}"/>`}
    for(let i=1;i<=12;i++){const a=Math.PI/6*i;b+=T(cx+60*Math.sin(a),cy-60*Math.cos(a)+1,i,{s:18,c:'#0f172a'})}

{t:'Repartos y proporcionalidad inversa',learn:{h:'<p><b>Inversa:</b> si uno se duplica, el otro se reduce a la mitad. 2 pintores tardan 6 días; 4 pintores tardan 3 días.</p><p>El producto se mantiene: 2·6 = 4·3 = 12.</p>',v:()=>'',x:''},

// ===== Laboratorios manipulables (sustituyen a GeoGebra) y animaciones paso a paso =====
const LAB={};
const EN=()=>window.APP&&window.APP.lang==='en';
const tr=(es,en)=>EN()?en:es;
function sl(id,label,min,max,val,step=1){return `<label class="sl"><span>${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><b id="${id}v">${val}</b></label>`}
function bindSl(root,ids,draw){ids.forEach(i=>{const e=root.querySelector('#'+i);e.addEventListener('input',()=>{root.querySelector('#'+i+'v').textContent=e.value;draw()})});draw()}
const gv=(root,i)=>+root.querySelector('#'+i).value;

LAB.blocks=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('c',tr('Centenas','Hundreds'),0,p.maxC??4,1)}${sl('d',tr('Decenas','Tens'),0,9,2)}${sl('u',tr('Unidades','Ones'),0,9,3)}`;
 bindSl(root,['c','d','u'],()=>{const c=gv(root,'c'),d=gv(root,'d'),u=gv(root,'u');root.querySelector('#lv').innerHTML=V.blocks(c,d,u);root.querySelector('#lr').innerHTML=`<b class="c-c">${c*100}</b> + <b class="c-d">${d*10}</b> + <b class="c-u">${u}</b> = <b class="big">${c*100+d*10+u}</b>`})};
LAB.fraction=(root,p={})=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('den',tr('Partes iguales (denominador)','Equal parts (denominator)'),1,12,4)}${sl('num',tr('Partes pintadas (numerador)','Shaded parts (numerator)'),0,12,3)}`;
 bindSl(root,['den','num'],()=>{const d=gv(root,'den'),ne=root.querySelector('#num');ne.max=d;if(+ne.value>d){ne.value=d;root.querySelector('#numv').textContent=d}const n=gv(root,'num');
  root.querySelector('#lv').innerHTML=V.pie(d,n,'#f97316')+V.bar(d,n,'#22c55e',300);const dec=n/d;root.querySelector('#lr').innerHTML=`${fr(n,d)} = <b>${EN()?fmtEN(+dec.toFixed(3)):fmt(+dec.toFixed(3))}</b> = <b>${EN()?fmtEN(+(dec*100).toFixed(1)):fmt(+(dec*100).toFixed(1))} %</b>`})};
LAB.percent=(root)=>{root.innerHTML=`<div class="labv" id="lv"></div><p class="labr" id="lr"></p>${sl('k',tr('Cuadraditos pintados','Shaded squares'),0,100,30)}`;
 bindSl(root,['k'],()=>{const k=gv(root,'k');root.querySelector('#lv').innerHTML=V.grid100(k,'#8b5cf6');root.querySelector('#lr').innerHTML=`<b class="big">${k} %</b> = ${fr(k,100)} = ${EN()?fmtEN(k/100):fmt(k/100)}`})};

 bindSl(root,['a','b'],()=>{const a=gv(root,'a'),b=gv(root,'b'),c=a+b,lo=Math.min(a,c,0)-1,hi=Math.max(a,c,0)+1;root.querySelector('#lv').innerHTML=V.line(Math.max(lo,-20),Math.min(hi,20),{jumps:[{from:a,to:c,t:(b>0?'+':'')+b,c:b<0?'#dc2626':'#2563eb'}],points:[{v:a,c:'#8b5cf6'},{v:c,t:c,c:'#16a34a'}]}).replace('<path d="M','<path class="draw" d="M');

<script>
// ===== Motor de la aplicación (interfaz) =====
{

{const order=[];const all=S.slice();const byT=t=>{const x=all.find(s=>s.t===t);if(!x)throw new Error('Falta sesión: '+t);return x};
 (A.units||[['',all.map(s=>s.t)]]).forEach(([u,ts])=>{const us=ts.map(byT);us.forEach(s=>{s.u=u;order.push(s)});

 const miss=all.filter(s=>!order.includes(s));if(miss.length)throw new Error('Sin unidad: '+miss.map(s=>s.t).join(', '));
 S.length=0;order.forEach(s=>S.push(s));
 S.push({t:L.reviewT,es:A.lang==='en'?'Repaso mezclado':'',u:L.finalU,mix:true,learn:{h:L.reviewH,v:()=>''},g:all.flatMap(s=>s.g)});
 if(A.lang==='en'){const pool=all.flatMap(s=>s.gl||[]);S.forEach(s=>{const gl=s.gl;if(!gl||gl.length<2)return;
   s.g.push(()=>{const p=pick(gl),toEs=Math.random()<.6;const ans=toEs?p[1]:p[0];const others=shuffle(pool.filter(x=>x!==p).map(x=>toEs?x[1]:x[0]));
     return{q:toEs?`How do you say <b>«${p[0]}»</b> in Spanish?`:`¿Cómo se dice <b>«${p[1]}»</b> en inglés?`,es:toEs?`¿Cómo se dice «${p[0]}» en español?`:`How do you say «${p[1]}» in English?`,vis:'',type:'mc',opts:mc(ans,others),ans,hint:'Look at the glossary of this session. · Mira el glosario.',exp:`<b>${p[0]}</b> = <b>${p[1]}</b>`}})})}
}
const KEY='app-'+A.key;
let store={best:{},log:[]};
try{const raw=localStorage.getItem(KEY);if(raw)store=Object.assign(store,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico={
 spk:'<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
 home:'<svg viewBox="0 0 24 24" width="26" height="26"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>',
 bulb:'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2zM9 19h6v2H9z" fill="currentColor"/></svg>',
 star:(on)=>`<svg viewBox="0 0 24 24" class="st ${on?'on':''}"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>`,
 back:'<svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'};
const stars=n=>[1,2,3].map(i=>ico.star(i<=n)).join('');
const strip=h=>h.replace(/<span class="fr"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g,' $1/$2 ').replace(/<sup>2<\/sup>/g,A.lang==='en'?' squared':' al cuadrado').replace(/<sup>3<\/sup>/g,A.lang==='en'?' cubed':' al cubo').replace(/<sup>(\d+)<\/sup>/g,A.lang==='en'?' to the power $1':' elevado a $1').replace(/<[^>]+>/g,' ').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&nbsp;/g,' ');
let ac;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const now=ac.currentTime;(ok?[523,659,784]:[220,196]).forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(.18,now+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.25);o.connect(g).connect(ac.destination);o.start(now+i*.09);o.stop(now+i*.09+.3)})}catch(e){}}
const showFr=o=>/^-?\d+\/\d+$/.test(o)?fr(...o.split('/')):esc(o);
const num=s=>{s=String(s).trim().replace(/\s/g,'').replace(/−/g,'-').replace(',','.');if(s.includes('/')){const[a,b]=s.split('/');return +a/+b}return s===''||s==='-'?NaN:+s};
let esOn=false;try{esOn=localStorage.getItem(KEY+'-es')==='1'}catch(e){}

// ---------- Inicio ----------
function home(){try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  const B=s=>store.best[s.t]||0;const tot=S.reduce((a,s)=>a+B(s),0),done=S.filter(s=>B(s)).length;let lastU=null;
  app.innerHTML=`<header class="hero band"><div class="hero-t"><p class="kick">${esc(A.sub)}</p><h1>${esc(A.name)}</h1>
   <p class="lead">${L.hello}</p><p class="tot">${ico.star(true)} <b>${tot}</b> / ${S.length*3} · ${done} ${L.done}</p></div>
   <div class="hero-v">${A.hero(done/S.length)}</div></header>
   <main class="band"><h2>${L.sessions}</h2>${S.map((s,i)=>{let h='';if(s.u!==lastU){h=(lastU!==null?'</div>':'')+`<h3 class="unit">${esc(s.u||'')}</h3><div class="grid">`;lastU=s.u}
     return h+`<button class="ses ${s.mix?'rev':''}" data-i="${i}" style="--c:${s.mix?'#0f172a':PAL[i%8]}"><span class="n">${s.mix?'★':i+1}</span><span class="tt">${esc(s.t)}${s.es?`<i>${esc(s.es)}</i>`:''}</span><span class="ss">${stars(B(s))}</span></button>`}).join('')}</div></main>
   <footer class="band foot"><button class="ghost" id="prof">${L.teacher}</button></footer>`;
  app.querySelectorAll('.ses').forEach(b=>b.onclick=()=>learn(+b.dataset.i));
  $('#prof').onclick=teacher;window.scrollTo(0,0)}

// ---------- Aprende ----------
function learn(i){const s=S[i],l=s.learn;
  app.innerHTML=`<div class="top band"><button class="icon" id="hm" aria-label="${L.home}">${ico.home}</button><h2>${L.session} ${i+1} · ${esc(s.t)}</h2></div>
   <section class="band"><div class="card learn" style="--c:${PAL[i%8]}"><p class="tag">${L.learn}</p>
   <div class="lt">${l.h}</div>${A.lang==='en'&&l.es?`<p class="es">${esc(l.es)}</p>`:''}
   <div class="visbox">${l.v()}</div>${l.x?`<p class="ex">${l.x}</p>`:''}
   ${STEPS[s.t]?`<div class="labbox"><p class="tag">${L.anim}</p><div id="stz"></div></div>`:''}
   ${LABMAP[s.t]?`<div class="labbox"><p class="tag">${L.lab}</p><p class="small">${L.labH}</p><div id="labz"></div></div>`:''}
   ${s.gl?`<div class="gl"><p class="tag">Glossary · Glosario</p><table class="glt"><tr><th>English</th><th>Español</th></tr>${s.gl.map(g=>`<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join('')}</table></div>`:''}
   <div class="row"><button class="cta big" id="go">${L.practice}</button></div></div></section>`;
  if(STEPS[s.t])stepper($('#stz'),STEPS[s.t]);if(LABMAP[s.t])LAB[LABMAP[s.t][0]]($('#labz'),LABMAP[s.t][1]||{});
  $('#hm').onclick=home;$('#go').onclick=()=>quiz(i);window.scrollTo(0,0);
}

// ---------- Práctica ----------
let Q;
function makeQs(i){const s=S[i],n=A.n,out=[],seen=new Set();let g=0;
  while(out.length<n&&g++<400){const gen=s.mix?pick(s.g):s.g[out.length<s.g.length?out.length:R(0,s.g.length-1)];const q=gen();if(!q)continue;const k=q.q+'|'+q.ans;if(seen.has(k))continue;seen.add(k);out.push(q)}return out}
function quiz(i){Q={i,qs:makeQs(i),k:0,score:0,tries:0,wrong:[]};ask()}
function ask(){const q=Q.qs[Q.k],s=S[Q.i];Q.tries=0;Q.input='';Q.locked=false;
  const dots=Q.qs.map((_,j)=>`<span class="dot ${j<Q.k?(Q.qs[j].res||''):j===Q.k?'cur':''}"></span>`).join('');
  app.innerHTML=`<div class="top band"><button class="icon" id="hm" aria-label="${L.home}">${ico.back}</button><div class="dots">${dots}</div><span class="cnt">${Q.k+1}/${Q.qs.length}</span></div>
   <section class="band"><div class="card qcard" style="--c:${PAL[Q.i%8]}">
    <div class="qh"><p class="qt">${q.q}</p></div>
    ${A.lang==='en'&&q.es?`<button class="estog ${esOn?'on':''}" id="est">Español</button><p class="es" id="esx" ${esOn?'':'hidden'}>${esc(q.es)}</p>`:''}
    <div class="qbody ${q.vis?'two':''}">${q.vis?`<div class="visbox">${q.vis}</div>`:''}<div id="ansz"></div></div><div id="fb" class="fb" hidden></div>
    <div class="row"><button class="ghost" id="hint">${ico.bulb} ${L.hint}</button><button class="cta big" id="chk" ${q.type==='mc'?'hidden':''}>${L.check}</button><button class="cta big" id="nx" hidden>${L.next}</button></div>
   </div></section>`;
  const z=$('#ansz');
  if(q.type==='mc'){const opts=q.fixed?q.opts:q.opts;z.innerHTML=`<div class="opts ${opts.length<=3?'o3':''}">${opts.map(o=>`<button class="opt" data-v="${esc(o)}">${showFr(String(o))}</button>`).join('')}</div>`;
    z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.locked||b.disabled)return;check(b.dataset.v,b)})}
  else if(q.type==='shade'){Q.sh=new Set();z.innerHTML=`<p class="inst">${L.tapShade}</p><div class="visbox tapbox">${shadeSvg(q.n,q.shape)}</div><p class="inst" id="shc">0 / ${q.n}</p>`;
    z.querySelectorAll('.pc').forEach(p=>p.addEventListener('click',()=>{if(Q.locked)return;const i=+p.dataset.i;Q.sh.has(i)?Q.sh.delete(i):Q.sh.add(i);p.classList.toggle('on');Q.input=String(Q.sh.size);$('#shc').textContent=Q.sh.size+' / '+q.n}));Q.input='0'}
  else if(q.type==='order'){Q.seq=[];z.innerHTML=`<p class="inst">${q.desc?L.tapOrderD:L.tapOrder}</p><div class="tray" id="tray"></div><div class="opts ords">${q.items.map((o,j)=>`<button class="opt ord" data-j="${j}">${showFr(String(o))}</button>`).join('')}</div><div class="row c"><button class="ghost" id="undo">${L.undo}</button></div>`;
    const draw=()=>{$('#tray').innerHTML=Q.seq.map(j=>`<span>${showFr(String(q.items[j]))}</span>`).join('<i>'+(q.desc?'&gt;':'&lt;')+'</i>')||'&nbsp;';z.querySelectorAll('.ord').forEach(b=>b.disabled=Q.seq.includes(+b.dataset.j));Q.input=Q.seq.length===q.items.length?Q.seq.map(j=>q.items[j]).join('|'):''};
    z.querySelectorAll('.ord').forEach(b=>b.onclick=()=>{if(Q.locked)return;Q.seq.push(+b.dataset.j);draw()});$('#undo').onclick=()=>{if(Q.locked)return;Q.seq.pop();draw()};draw()}
  else{const keys=A.keys;z.innerHTML=`<div class="disp" id="disp" aria-live="polite">&nbsp;</div><div class="pad">${keys.map(k=>`<button class="key ${k==='⌫'?'del':''}" data-k="${k}">${k}</button>`).join('')}</div>`;
    z.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k))}
  $('#hm').onclick=home;$('#hint').onclick=()=>fb('hint',q.hint);$('#chk').onclick=()=>{if(!Q.locked&&Q.input!=='')check(Q.input)};$('#nx').onclick=next;
  const et=$('#est');if(et)et.onclick=()=>{esOn=!esOn;try{localStorage.setItem(KEY+'-es',esOn?'1':'0')}catch(e){}et.classList.toggle('on',esOn);$('#esx').hidden=!esOn};
  window.scrollTo(0,0)}
function press(k){if(Q.locked)return;let s=Q.input;if(k==='⌫')s=s.slice(0,-1);else if(k==='−'){s=s.startsWith('-')?s.slice(1):'-'+s}else if(s.length<10)s+=k;Q.input=s;$('#disp').textContent=s.replace('-','−')||' '}
document.addEventListener('keydown',e=>{if(!Q||!$('#disp')||Q.locked)return;if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('⌫');else if(e.key==='-')press('−');else if(e.key===','||e.key==='.')press(A.dec);else if(e.key==='/')press('/');else if(e.key==='Enter'&&Q.input)check(Q.input)});
function fb(kind,html){const f=$('#fb');f.hidden=false;f.className='fb '+kind;f.innerHTML=(kind==='hint'?`<b>${L.hint}:</b> `:'')+html}
function check(v,btn){const q=Q.qs[Q.k];let ok;
  if(q.type==='mc')ok=String(v)===String(q.ans);
  else if(q.type==='order')ok=String(v)===q.ans.join('|');
  else if(q.exact)ok=String(v).replace(/\s/g,'')===String(q.ans);
  else{const a=num(v),b=typeof q.ans==='number'?q.ans:num(q.ans);ok=isFinite(a)&&Math.abs(a-b)<1e-9}
  Q.tries++;beep(ok);
  if(ok){Q.locked=true;const pts=Q.tries===1?1:.5;Q.score+=pts;q.res=Q.tries===1?'ok':'half';if(btn)btn.classList.add('good');else if($('#disp'))$('#disp').classList.add('good');
    fb('ok',`<b>${pick(L.praise)}</b> ${q.exp}`);if(Q.tries===1)confetti();end()}
  else if(Q.tries<2){if(btn){btn.classList.add('bad');btn.disabled=true}else if($('#disp')){$('#disp').classList.add('bad');setTimeout(()=>{const d=$('#disp');if(d){d.classList.remove('bad');Q.input='';d.innerHTML='&nbsp;'}},700)}
    fb('try',`<b>${L.again}</b> ${q.hint}`);}
  else{Q.locked=true;q.res='no';Q.wrong.push(strip(q.q).replace(/\s+/g,' ').trim()+' → '+(Array.isArray(q.ans)?q.ans.join(', '):String(q.ans)));if(btn)btn.classList.add('bad');else if($('#disp'))$('#disp').classList.add('bad');
    z_show(q);fb('no',`${L.sol} <b>${Array.isArray(q.ans)?q.ans.map(x=>showFr(String(x))).join(q.desc?' &gt; ':' &lt; '):showFr(String(q.ans))}</b>. ${q.exp}`);end()}
  function end(){$('#chk').hidden=true;$('#nx').hidden=false;$('#nx').focus()}}
function shadeSvg(n,shape){if(shape==='pie'){const cx=110,cy=110,r=100;let b='';for(let i=0;i<n;i++){const a1=2*Math.PI*i/n-Math.PI/2,a2=2*Math.PI*(i+1)/n-Math.PI/2;b+=`<path class="pc" data-i="${i}" d="M${cx} ${cy}L${(cx+r*Math.cos(a1)).toFixed(2)} ${(cy+r*Math.sin(a1)).toFixed(2)}A${r} ${r} 0 0 1 ${(cx+r*Math.cos(a2)).toFixed(2)} ${(cy+r*Math.sin(a2)).toFixed(2)}Z"/>`}return `<svg class="vis tap sq" viewBox="0 0 220 220">${b}</svg>`}
  if(shape==='grid'){const c=n%5===0&&n>5?5:n%4===0&&n>4?4:n%3===0&&n>3?3:n,r=n/c;let b='';for(let i=0;i<n;i++)b+=`<rect class="pc" data-i="${i}" x="${6+(i%c)*64}" y="${6+Math.floor(i/c)*64}" width="64" height="64"/>`;return `<svg class="vis tap" viewBox="0 0 ${c*64+12} ${r*64+12}">${b}</svg>`}
  const w=Math.min(90,560/n);let b='';for(let i=0;i<n;i++)b+=`<rect class="pc" data-i="${i}" x="${6+i*w}" y="6" width="${w}" height="90"/>`;return `<svg class="vis tap" viewBox="0 0 ${n*w+12} 102">${b}</svg>`}
function z_show(q){app.querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===String(q.ans))b.classList.add('good')})}
function next(){Q.k++;if(Q.k<Q.qs.length)ask();else finish()}
function finish(){const p=Q.score/Q.qs.length,st=p>=.9?3:p>=.7?2:p>=.4?1:0,i=Q.i;
  store.best[S[i].t]=Math.max(store.best[S[i].t]||0,st);store.log.unshift({s:i,t:S[i].t,d:new Date().toISOString(),sc:Q.score,n:Q.qs.length,w:Q.wrong});store.log=store.log.slice(0,300);save();
  app.innerHTML=`<section class="band endb"><div class="card end" style="--c:${PAL[i%8]}"><p class="tag">${L.session} ${i+1}</p><h2>${st>=2?L.great:st===1?L.good:L.keep}</h2>
   <div class="bigstars">${stars(st)}</div><p class="sc">${String(Q.score).replace('.',A.dec)} / ${Q.qs.length} ${L.points}</p>
   <div class="row"><button class="ghost big" id="rep">${L.repeat}</button>${i<S.length-1?`<button class="ghost big" id="nxs">${L.nextS}</button>`:''}<button class="cta big" id="hm">${L.menu}</button></div></div></section>`;
  if(st>=2)confetti(60);$('#rep').onclick=()=>quiz(i);$('#hm').onclick=home;const n=$('#nxs');if(n)n.onclick=()=>learn(i+1);}
function confetti(n=24){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('div');c.className='conf';for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=PAL[i%8];p.style.animationDelay=Math.random()*.3+'s';p.style.transform=`rotate(${Math.random()*360}deg)`;c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),1800)}

// ---------- Panel del profesor ----------
function teacher(){const d=document.createElement('div');d.className='modal';
  const rows=store.log.map(r=>{const dt=new Date(r.d);return `<tr><td>${dt.toLocaleDateString('es-ES')} ${dt.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(r.t||'')}</td><td class="r">${String(r.sc).replace('.',',')}/${r.n}</td><td class="r">${Math.round(r.sc/r.n*100)} %</td><td class="w">${r.w.map(esc).join('<br>')}</td></tr>`}).join('');
  d.innerHTML=`<div class="mbox"><h2>Panel del profesor · ${esc(A.name)}</h2><p class="small">Los datos se guardan solo en este iPad y en este navegador.</p>
   <div class="sum">${S.map((s,i)=>`<span title="${esc(s.t)}">${s.mix?'★':i+1} ${stars(store.best[s.t]||0)}</span>`).join('')}</div>
   <div class="scroll"><table><thead><tr><th>Fecha</th><th>Sesión</th><th>Puntos</th><th>%</th><th>Fallos (pregunta → solución)</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Todavía no hay sesiones hechas.</td></tr>'}</tbody></table></div>
   <div class="row"><button class="ghost" id="cp">Copiar informe</button><button class="ghost" id="rs">Borrar datos</button><button class="cta" id="cl">Cerrar</button></div><p class="small" id="msg"></p></div>`;
  document.body.appendChild(d);
  d.querySelector('#cl').onclick=()=>{d.remove();home()};
  d.querySelector('#cp').onclick=()=>{const t='Informe '+A.name+'\n'+store.log.map(r=>`${new Date(r.d).toLocaleString('es-ES')} | ${r.t||''} | ${r.sc}/${r.n}${r.w.length?' | Fallos: '+r.w.join('; '):''}`).join('\n');
    try{navigator.clipboard.writeText(t).then(()=>d.querySelector('#msg').textContent='Informe copiado. Pégalo en tu Diario o en un correo.',()=>d.querySelector('#msg').textContent='No se ha podido copiar.')}catch(e){d.querySelector('#msg').textContent='No se ha podido copiar.'}};
  let arm=false;d.querySelector('#rs').onclick=e=>{if(!arm){arm=true;e.target.textContent='Pulsa otra vez para borrar todo';return}store={best:{},log:[]};save();d.remove();home()}}
home();
}
